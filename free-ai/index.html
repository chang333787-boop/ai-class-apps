<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>free ai</title>
<style>
:root{
  --bg:#f3f6fb; --panel:#ffffff; --side:#e9f0fb; --ink:#1f2937; --sub:#6b7280;
  --line:#d4deec; --accent:#2563eb; --accent-2:#7c3aed; --accent-soft:#dbeafe;
  --heart:#ef4444; --gold:#f59e0b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:translateY(2px) scale(.97)}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}

/* ── 위쪽 띠 ── */
.top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:2px solid var(--line);position:relative;z-index:4}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{box-shadow:0 1px 0 var(--line)}
.icon-btn{width:44px;justify-content:center;padding:0}
.menu-btn{display:none}
.logo{flex:1;text-align:center;font-weight:900;font-size:28px;letter-spacing:.5px;line-height:1.1}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:0}
.hearts{display:inline-flex;align-items:center;gap:4px;font-size:17px;white-space:nowrap;font-weight:800;color:var(--heart);padding:6px 10px;border-radius:999px;background:#fff1f2;position:relative}
.hearts.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:scale(1)}30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.92) rotate(4deg)}}
.minus{position:absolute;right:4px;top:-4px;font-size:14px;color:var(--heart);font-weight:900;pointer-events:none;animation:floatUp .9s forwards}
@keyframes floatUp{to{transform:translateY(-26px);opacity:0}}
.nick{border:none;background:none;font-size:17px;color:var(--sub);padding:8px 4px;min-height:44px}

/* ── 왼쪽 메뉴 ── */
.side{background:var(--side);border-right:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.side .brand{font-weight:900;font-size:24px;padding:4px 8px}
.side .nick-side{display:none;text-align:left}
.side .new{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:18px;text-align:left;font-weight:800;box-shadow:0 4px 0 var(--line);margin:4px 0 6px}
.side h3{margin:10px 8px 2px;font-size:14px;color:var(--sub);letter-spacing:.5px}
.hist{background:none;border:none;text-align:left;padding:11px 10px;border-radius:12px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;min-height:44px;transition:background .15s}
.hist:hover{background:rgba(255,255,255,.6)}
.hist.on{background:#fff;font-weight:800;box-shadow:inset 4px 0 0 var(--accent)}
.side .empty{color:var(--sub);font-size:15px;padding:4px 10px}
.side .spacer{flex:1}
.records{background:#fff;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.6;border:2px solid var(--line)}
.records b{color:var(--accent-2)}

/* ── 가운데 ── */
.main{display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.chat{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hello{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;animation:fadeUp .4s}
.hello h2{font-size:clamp(26px,4vw,38px);margin:2px 0 6px}
.hello .mascot-big{width:min(240px,58vw)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:17px;min-height:46px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.chip:hover{background:#f8fbff}
.chip:active{box-shadow:0 1px 0 var(--line)}
.chip:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:flex-end;max-width:780px;width:100%;margin:0 auto;animation:fadeUp .25s}
.row.me{justify-content:flex-end}
.bubble{padding:12px 16px;border-radius:20px;max-width:78%;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.me .bubble{background:linear-gradient(135deg,var(--accent),#3b82f6);color:#fff;border-bottom-right-radius:6px;box-shadow:0 3px 0 #1d4ed8}
.ai .bubble{background:#fff;border:2px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 3px 0 var(--line)}
.ai .face{width:52px;flex:none}
.bubble .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;white-space:normal}
.bubble .opts .chip{font-size:17px}
.say{border:none;background:var(--accent-soft);border-radius:10px;padding:4px 10px;margin-left:6px;font-size:16px;vertical-align:middle;min-height:34px}
.dots{display:inline-flex;gap:6px;padding:6px 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:#94a3b8;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
.caret::after{content:"▍";color:var(--accent);animation:caret .7s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.ai .bubble.endcard{font-weight:700;background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b;box-shadow:0 3px 0 #d97706}

/* ── 아래 입력창 ── */
.bottom{padding:6px 16px 10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bottom .chips{margin:0 auto 8px;max-width:780px}
.honest{max-width:780px;margin:0 auto 6px;text-align:center;font-size:14px;color:#92400e;background:#fffbeb;border:1.5px dashed #f59e0b;border-radius:12px;padding:6px 10px}
.ask{display:flex;align-items:center;gap:8px;max-width:780px;margin:0 auto;background:#fff;border:3px solid #1f2937;border-radius:999px;padding:6px 6px 6px 20px;box-shadow:0 4px 0 #1f2937;transition:box-shadow .15s}
.ask:focus-within{box-shadow:0 4px 0 var(--accent);border-color:var(--accent)}
.ask input{flex:1;border:none;outline:none;font-size:19px;padding:10px 0;background:transparent;min-width:0}
.send{width:52px;height:52px;border-radius:50%;border:3px solid #1f2937;background:#fff;font-size:24px;font-weight:900;flex:none;transition:background .15s,color .15s}
.ask:focus-within .send{background:var(--accent);color:#fff;border-color:var(--accent)}
.send:disabled,.ask input:disabled{opacity:.45;cursor:not-allowed}

/* ── 마스코트 말풍선 (오른쪽 아래) ── */
.pop{position:absolute;right:14px;bottom:150px;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(14px) scale(.9);transition:opacity .25s,transform .25s cubic-bezier(.3,1.6,.6,1);z-index:5}
.pop.show{opacity:1;transform:none}
.pop .words{background:#fff;border:3px solid #1f2937;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:20px;font-weight:900;margin-bottom:46px;box-shadow:0 4px 0 #1f2937;white-space:nowrap}
.pop .face-pop{width:120px}

/* ── 마스코트 움직임 ── */
.mascot .eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.talk{animation:talk .5s}
@keyframes talk{0%{transform:scale(1)}35%{transform:scale(1.08,.94)}70%{transform:scale(.96,1.04)}100%{transform:scale(1)}}

/* ── 반짝이 ── */
.spark{position:absolute;font-size:24px;pointer-events:none;z-index:8}

/* ── 창(모달) ── */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.box{background:#fff;border-radius:22px;padding:22px;width:min(480px,100%);max-height:90vh;overflow-y:auto;animation:fadeUp .2s}
.box h2{margin:0 0 12px;font-size:24px}
.box input{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:12px}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.box .go{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 #1d4ed8}
.rc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 6px;font-size:17px}
.rc dt{color:var(--sub)}
.rc dd{margin:0;font-weight:800}
.rc .pn{font-size:13px;color:var(--sub);margin:0 0 8px}
.rc h3{font-size:18px;margin:14px 0 6px}
.rc ul{margin:0;padding-left:20px;line-height:1.6;font-size:16px}
.rc li{margin-bottom:6px}

/* ── 좁은 화면(크롬북 세로·태블릿·휴대폰) ── */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .top{grid-column:1;flex-wrap:wrap;row-gap:6px}
  .logo{order:-1;flex-basis:100%;font-size:24px}
  .logo small{display:none}
  .menu-btn{display:inline-flex}
  .top .nick{display:none}
  .hearts{margin-left:auto}
  .btn{padding:8px 10px;font-size:16px}
  .side{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:15;transform:translateX(-105%);transition:transform .22s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .side .nick-side{display:block}
  .ai .face{width:40px}
  .bubble{max-width:84%}
  .pop{bottom:160px;right:8px}
  .pop .face-pop{width:86px}
  .pop .words{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="btn" href="../">← 처음으로</a>
    <button class="btn icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
    <div class="logo"><b>free ai</b><small>누구든지 언제나 무엇이든 쉽고 편하게</small></div>
    <span class="hearts" id="hearts" title="오늘 남은 사용량(질문 수)"></span>
    <button class="btn icon-btn" id="soundBtn" aria-label="소리 켜고 끄기">🔈</button>
    <button class="nick" id="nickBtn" title="이름 바꾸기"></button>
    <button class="btn" id="receiptBtn">🧾 만든 기록</button>
  </header>

  <nav class="side" id="side">
    <div class="brand">free ai</div>
    <button class="nick nick-side" id="nickBtn2" title="이름 바꾸기"></button>
    <button class="new" id="newBtn">✏️ 새 채팅</button>
    <h3>채팅</h3>
    <div id="nowList"></div>
    <h3>내역</h3>
    <div id="histList"></div>
    <div class="spacer"></div>
    <div class="records" id="records"></div>
  </nav>

  <main class="main" id="mainArea">
    <div class="chat" id="chat"></div>
    <div class="bottom">
      <div class="chips" id="stuckChips" hidden></div>
      <div class="honest">💡 이 AI는 정해진 대답만 해요. 진짜 AI는 질문마다 돈이 들어요.</div>
      <form class="ask" id="askForm" autocomplete="off">
        <input id="q" maxlength="80" placeholder="질문 쓰는데" aria-label="질문 쓰는 곳">
        <button class="send" id="sendBtn" aria-label="보내기">↑</button>
      </form>
    </div>
    <div class="pop" id="pop"><div class="words" id="popWords"></div><div class="face-pop" id="popFace"></div></div>
  </main>
</div>

<!-- 이름(별명) 창 -->
<div class="modal" id="nickModal">
  <form class="box" id="nickForm">
    <h2>내 별명을 알려 줘!</h2>
    <p style="margin:0 0 10px;color:var(--sub)">진짜 이름 말고 별명을 써 주세요. 이 기기에만 저장돼요.</p>
    <input id="nickInput" maxlength="8" placeholder="예) 질문왕">
    <div class="acts"><button type="submit" class="btn go">시작하기</button></div>
  </form>
</div>

<!-- 만든 기록 창 -->
<div class="modal" id="receiptModal">
  <div class="box rc">
    <h2>🧾 만든 기록</h2>
    <div id="receiptBody">불러오는 중…</div>
    <div class="acts"><button class="btn" id="receiptClose">닫기</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* =========================================================
   마스코트: 임시저장261104 14-22 (모니터) — 아이 그림 그대로
   ========================================================= */
var MASCOT_NAME = '임시저장261104 14-22';
var LINES = {            // 아이가 쓴 5가지 말 (말버릇: 아재말투)
  hello: '어 안녕하세요',  // 처음 켰을 때 (원래 글씨 판독 확인 전 임시 문구)
  good:  '어 잘했어',      // 잘했을 때
  wrong: '어 틀렸어',      // 틀렸을 때
  stuck: '어 막혔어',      // 막혔을 때
  end:   '어 끝났어'       // 끝났을 때
};
var INK='#1f2937';
function face(mood){
  var E='', M='', X='';
  var dot=function(x,y,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||7)+'" fill="'+INK+'"/>'; };
  var shine=function(x,y){ return '<circle cx="'+x+'" cy="'+y+'" r="2.4" fill="#fff"/>'; };
  var line=function(d,w){ return '<path d="'+d+'" fill="none" stroke="'+INK+'" stroke-width="'+(w||6)+'" stroke-linecap="round" stroke-linejoin="round"/>'; };
  switch(mood){
    case 'happy': E=line('M66 80 q12 -14 24 0 M130 80 q12 -14 24 0'); M=line('M92 92 q18 18 36 0'); break;
    case 'smart': E=dot(78,78)+dot(142,78)+shine(81,75)+shine(145,75); M=line('M96 94 q14 10 28 0');
      X='<path d="M176 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#f59e0b" stroke="'+INK+'" stroke-width="2"/>'; break;
    case 'laugh': E=line('M66 76 l12 6 -12 6 M154 76 l-12 6 12 6',5); M='<path d="M90 90 q20 26 40 0 z" fill="'+INK+'"/><path d="M100 100 q10 8 20 0" fill="#f87171"/>'; break;
    case 'sad': E=dot(78,80,6)+dot(142,80,6)+line('M64 66 l20 6 M156 66 l-20 6',4); M=line('M96 100 q14 -12 28 0');
      X='<path d="M150 90 q-5 10 0 14 q5 -4 0 -14z" fill="#60a5fa" stroke="'+INK+'" stroke-width="2"/>'; break;
    case 'think': E=dot(84,74)+dot(148,74)+shine(86,71)+shine(150,71); M=line('M100 98 h20');
      X='<circle cx="168" cy="44" r="4" fill="'+INK+'"/><circle cx="180" cy="38" r="5" fill="'+INK+'"/><circle cx="194" cy="34" r="6" fill="'+INK+'"/>'; break;
    case 'stuck': E=dot(78,78,6)+dot(142,78,6); M=line('M98 98 q6 -6 12 0 q6 6 12 0',5);
      X='<text x="168" y="62" font-size="30" font-weight="900" fill="'+INK+'" font-family="system-ui,sans-serif">?</text>'; break;
    case 'party': E='<path d="M78 66 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1z" fill="#f59e0b" stroke="'+INK+'" stroke-width="2.5"/><path d="M142 66 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1z" fill="#f59e0b" stroke="'+INK+'" stroke-width="2.5"/>';
      M='<path d="M88 92 q22 28 44 0 z" fill="'+INK+'"/>'; break;
    default: E=dot(78,78)+dot(142,78)+shine(81,75)+shine(145,75); M=line('M94 92 q16 14 32 0');
  }
  return {E:E,M:M,X:X};
}
function mascotSVG(mood, cls){
  var f=face(mood);
  return '<svg class="mascot '+(cls||'')+'" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="마스코트 '+MASCOT_NAME+'">'+
    // 받침 (아이 그림: 곡선 + 검게 칠한 X자 다리)
    '<path d="M24 158 q43 26 86 0 q43 26 86 0" fill="none" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M92 142 L130 194 M130 142 L92 194" stroke="'+INK+'" stroke-width="13" stroke-linecap="round"/>'+
    // 모니터 몸
    '<rect x="8" y="8" width="204" height="138" rx="16" fill="#3b82f6" stroke="'+INK+'" stroke-width="8"/>'+
    '<rect x="22" y="22" width="176" height="110" rx="8" fill="#e0f2fe" stroke="'+INK+'" stroke-width="4"/>'+
    '<path d="M30 30 h60" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>'+
    '<text x="110" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="'+INK+'" font-family="system-ui,sans-serif">free AI</text>'+
    '<ellipse cx="62" cy="98" rx="9" ry="5" fill="#fda4af" opacity=".8"/><ellipse cx="158" cy="98" rx="9" ry="5" fill="#fda4af" opacity=".8"/>'+
    '<g class="eyes">'+f.E+'</g>'+f.M+f.X+
    '<text x="110" y="124" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155" font-family="system-ui,sans-serif">그대신 사용량은 있다</text>'+
    '</svg>';
}

/* =========================================================
   소리 (파일 없이 직접 만든 효과음)
   ========================================================= */
var AC=null;
function tone(freq, start, dur, type, vol){
  if(!S.sound) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t=AC.currentTime+start, o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
var SFX={
  send:function(){ tone(520,0,.08,'triangle'); tone(780,.06,.1,'triangle'); },
  recv:function(){ tone(880,0,.09,'sine',.12); },
  good:function(){ tone(660,0,.1,'triangle'); tone(990,.1,.16,'triangle'); },
  wrong:function(){ tone(330,0,.14,'square',.08); tone(220,.13,.2,'square',.08); },
  party:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,i*.08,.18,'triangle'); }); },
  end:function(){ [784,659,523,392].forEach(function(f,i){ tone(f,i*.12,.22,'sine'); }); },
  click:function(){ tone(700,0,.05,'triangle',.08); }
};

/* =========================================================
   저장 (부품 15: 저장 = 아이가 쓴 "기억하기")
   ========================================================= */
var KEY='freeai.v1', MAX_CHATS=8, DAILY=30;
function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function load(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || typeof s!=='object') s={};
  if(!Array.isArray(s.chats)) s.chats=[];
  if(!s.best) s.best={quiz:0, chain:0};
  if(typeof s.sound!=='boolean') s.sound=true;
  if(!s.hearts || s.hearts.date!==today()) s.hearts={date:today(), left:DAILY, used:0};
  if(typeof s.hearts.used!=='number') s.hearts.used=0;
  return s;
}
var S=load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function current(){ for(var i=0;i<S.chats.length;i++) if(S.chats[i].id===S.cur) return S.chats[i]; return null; }

/* =========================================================
   연습용 AI 대답 (키 없음, 전부 이 기기 안에서)

/* 계산: 숫자와 + − × ÷ ( ) 만 있는 식을 안전하게 풀기 */
function calc(src){
  var s=src.replace(/더하기|플러스/g,'+').replace(/빼기|마이너스/g,'-').replace(/곱하기|×|x|\*/gi,'*').replace(/나누기|÷|\//g,'/');
  s=s.replace(/[^0-9.+\-*/()]/g,'');
  if(!/\d[+\-*/(]*.*[+\-*/].*\d/.test(s)) return null;
  var i=0;
  function num(){ var m=s.slice(i).match(/^\d+(\.\d+)?/); if(!m) throw 0; i+=m[0].length; return +m[0]; }
  function atom(){ if(s[i]==='('){ i++; var v=expr(); if(s[i]!==')') throw 0; i++; return v; } if(s[i]==='-'){ i++; return -atom(); } return num(); }
  function term(){ var v=atom(); while(s[i]==='*'||s[i]==='/'){ var o=s[i++], b=atom(); if(o==='/'&&b===0) throw 'zero'; v=o==='*'?v*b:v/b; } return v; }
  function expr(){ var v=term(); while(s[i]==='+'||s[i]==='-'){ var o=s[i++], b=term(); v=o==='+'?v+b:v-b; } return v; }
  try{ var v=expr(); if(i!==s.length) return null; return {expr:s, val:Math.round(v*1000)/1000}; }
  catch(e){ return e==='zero'?{zero:true}:null; }
}
function pretty(expr){ return expr.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/(\d|\))-/g,'$1 − '); }

/* 끝말잇기: 두음법칙(ㄹ→ㄴ/ㅇ, ㄴ→ㅇ)까지 인정 */
function starts(ch){
  var c=ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return [ch];
  var cho=Math.floor(c/588), jung=Math.floor((c%588)/28), jong=c%28, out=[ch];
  var iy=[2,6,7,12,17,20].indexOf(jung)>=0;
  var mk=function(nc){ return String.fromCharCode(0xAC00+nc*588+jung*28+jong); };
  if(cho===5) out.push(mk(iy?11:2));
  else if(cho===2 && iy) out.push(mk(11));
  return out;
}

function fairPick(cands, used){
  var fair=cands.filter(function(w){ var ok=starts(w[w.length-1]); return CHAIN.some(function(x){ return ok.indexOf(x[0])>=0 && x!==w && used.indexOf(x)<0; }); });
  return pick(fair.length?fair:cands);
}

  var lc=w[w.length-1], ok=starts(lc);
  var cand=CHAIN.filter(function(x){ return ok.indexOf(x[0])>=0 && g.used.indexOf(x)<0; });
  if(!cand.length){ c.mode=null; return {text:'어 졌다… '+needText(lc)+'(으)로 시작하는 낱말이 생각 안 나!\n네가 이겼어! 🎉 ('+g.streak+'번 이어 감)', mood:'party', known:true, party:true}; }
  var mine=fairPick(cand, g.used); g.used.push(mine); g.last=mine[mine.length-1];
  return {text:'어 좋아! 나는 "'+mine+'"!\n이번엔 '+needText(g.last)+'(으)로 시작하는 낱말! ('+g.streak+'번째 성공)', mood:'happy', known:true};
}

function quizAsk(g){
  var q=QUIZ[g.qs[g.i]];
  return {text:(g.i+1)+'번 문제 (5문제 중)\n'+q[0], opts:shuffle([q[1]].concat(q[2]))};
}
function quizMove(c, text){
  var g=c.mode, q=QUIZ[g.qs[g.i]], t=text.replace(/\s/g,'').toLowerCase(), ok=t===q[1].replace(/\s/g,'').toLowerCase();
  var head, r={known:true};
  if(ok){ g.score++; head='어 잘했어! 정답이야 ⭐'; r.mood='party'; r.party=true; r.good=true; }
  else { head='어 틀렸어. 정답은 "'+q[1]+'"!'; r.mood='sad'; r.known=false; }
  g.i++;
  if(g.i>=g.qs.length){
    var stars=g.score>=5?'⭐⭐⭐':g.score>=3?'⭐⭐':g.score>=1?'⭐':'(별 없음)';
    var best=g.score>S.best.quiz; if(best) S.best.quiz=g.score;
    r.text=head+'\n\n퀴즈 끝! 5문제 중 '+g.score+'개 맞혔어. '+stars+(best?'\n🏆 최고 기록이야!':'');
    if(g.score>=3){ r.party=true; r.mood='party'; }
    c.mode=null; return r;
  }
  var nx=quizAsk(g); r.text=head+'\n\n'+nx.text; r.opts=nx.opts; return r;
}

function answer(raw, c){
  var q=raw.trim().toLowerCase().replace(/\s+/g,' '), nos=q.replace(/\s/g,'');
  if(/\d{2,3}-?\d{3,4}-?\d{4}/.test(nos)) return {text:'전화번호 같은 건 여기에 쓰지 마! 내 정보는 소중하니까.', mood:'sad', known:true};
  if(has(nos,['바보','멍청','씨발','시발','개새','병신','죽어','꺼져'])) return {text:'어 그런 말은 마음이 아파. 고운 말로 다시 물어봐 줄래?', mood:'sad', known:true};

  // 놀이 중이면 놀이부터
  if(c.mode){
    if(has(nos,['그만','안할래','끝내','멈춰'])){
      var msg = c.mode.type==='chain' ? '어 끝났어! 끝말잇기 '+c.mode.streak+'번 이어 갔어.' : '어 끝났어! 퀴즈는 '+c.mode.score+'개 맞혔어.';
      c.mode=null; return {text:msg+'\n또 하고 싶으면 언제든 말해 줘.', mood:'happy', known:true};
    }
    // 놀이와 상관없는 질문이면 놀이를 멈추고 그 질문에 대답
    var leave=false;
    if(c.mode.type==='chain'){
      leave=/\s|\?|？/.test(raw.trim()) || has(nos,['개그','퀴즈','뭐야','알려','해줘','영어로','몇시','날짜']);
      if(!leave) return chainMove(c, raw);
    } else if(c.mode.type==='quiz'){
      var cq=QUIZ[c.mode.qs[c.mode.i]], choices=[cq[1]].concat(cq[2]).map(function(x){ return x.replace(/\s/g,'').toLowerCase(); });
      if(choices.indexOf(nos)>=0) return quizMove(c, raw);
      leave=true;
    }
    if(leave){
      var label=c.mode.type==='chain'?'끝말잇기':'퀴즈'; c.mode=null;
      var r=answer(raw, c); r.text='('+label+'는 여기서 멈출게!)\n'+r.text; return r;
    }
  }
  if(has(nos,['끝말잇기','끝말'])){
    var first=fairPick(CHAIN, []); c.mode={type:'chain', last:first[first.length-1], used:[first], streak:0};
    return {text:'어 좋아! 끝말잇기 시작! 내가 먼저 할게.\n"'+first+'"!\n'+needText(c.mode.last)+'(으)로 시작하는 낱말을 말해 봐. (그만하려면 "그만")', mood:'happy', known:true};
  }
  if(has(nos,['퀴즈','문제내','수수께끼'])){
    c.mode={type:'quiz', qs:shuffle(QUIZ.map(function(_,i){ return i; })).slice(0,5), i:0, score:0};
    var a=quizAsk(c.mode); return {text:'어 좋아! 퀴즈 시작! 아래 보기를 눌러 봐.\n\n'+a.text, opts:a.opts, mood:'smart', known:true};
  }
  var m=nos.match(/([1-9])단/);
  if(m){ var n=+m[1], out=[]; for(var i=1;i<=9;i++) out.push(n+' × '+i+' = '+(n*i)); return {text:'어 '+n+'단이야!\n'+out.join('\n'), mood:'smart', known:true}; }
  var cc=calc(nos);
  if(cc){ if(cc.zero) return {text:'어 0으로는 나눌 수 없어!', mood:'think', known:true}; return {text:'어 '+pretty(cc.expr)+' = '+cc.val+' 이야!', mood:'smart', known:true}; }
  var en=q.match(/^(.+?)(?:을|를|은|는|이|가)?\s*영어로/);
  if(en){ var k=en[1].replace(/\s/g,''); if(EN[k]) return {text:'어 "'+k+'"는 영어로 "'+EN[k]+'"야!', mood:'smart', known:true, speakEn:EN[k]}; return {text:'어 그 낱말은 아직 영어로 몰라. 사과·고양이·학교 같은 건 알아!', mood:'sad', known:false}; }
  if(has(nos,['안녕','하이','hello','반가워'])) return {text:'어 안녕! 나는 free ai야. 궁금한 걸 물어봐.', mood:'happy', known:true};
  if(has(nos,['누구','너이름','이름이뭐','이름뭐'])) return {text:'어 나는 '+MASCOT_NAME+'야. 연습용 AI라서 정해진 대답만 할 수 있어.', mood:'happy', known:true};
  if(has(nos,['고마워','고맙','감사'])) return {text:'어 별말씀을! 또 물어봐.', mood:'happy', known:true};
  if(has(nos,['심심','놀자','놀아'])) return {text:'어 그럼 놀자! "끝말잇기 하자"나 "퀴즈 내 줘"라고 말해 봐.', mood:'happy', known:true};
  if(has(nos,['사랑해','좋아해'])) return {text:'어 나도! 근데 하트는 아껴 써. 사용량이 있거든.', mood:'laugh', known:true};
  if(has(nos,['돈','공짜','무료','요금'])) return {text:'어 나는 정해진 대답만 해서 공짜야. 진짜 AI는 질문 하나마다 돈이 들어. 그래서 하트(사용량)가 있는 거야!', mood:'think', known:true};
  if(has(nos,['뭐할수','할수있','뭘할수','도움말','사용법','뭐해'])) return {text:'어 나는 이런 걸 할 수 있어!\n· 계산 (예: 12 곱하기 4, (3+5)×2)\n· 구구단 (예: 7단)\n· 낱말 뜻 (예: 둔각이 뭐야?)\n· 영어 낱말 (예: 사과 영어로)\n· 끝말잇기 · 퀴즈 · 아재개그\n· 오늘 날짜·시간 · 공부 팁', mood:'smart', known:true};
  var d=new Date(), wk='일월화수목금토'.charAt(d.getDay());
  if(has(nos,['몇시','시간','시각'])) return {text:'어 지금은 '+d.getHours()+'시 '+d.getMinutes()+'분이야.', mood:'smart', known:true};
  if(has(nos,['요일'])) return {text:'어 오늘은 '+wk+'요일이야.', mood:'smart', known:true};
  if(has(nos,['날짜','며칠','몇월','오늘'])) return {text:'어 오늘은 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+wk+'요일이야.', mood:'smart', known:true};
  if(has(nos,['날씨'])) return {text:'어 나는 바깥을 못 봐서 날씨는 몰라. 창문을 한번 봐!', mood:'think', known:true};
  if(has(nos,['개그','농담','웃긴','재밌는','재미있는','웃겨'])) return {text:pick(JOKES)+' 어 웃었어?', mood:'laugh', known:true};
  if(has(nos,['공부','받아쓰기','숙제','정리','집중','외우'])) return {text:pick(TIPS), mood:'smart', known:true};
  for(var j=0;j<WORD_KEYS.length;j++){ var w=WORD_KEYS[j]; if(nos.indexOf(w)>=0) return {text:'어 "'+w+'"(이)란 '+WORDS[w], mood:'smart', known:true}; }
  return {text:'어 그건 아직 몰라. 나는 연습용 AI라서 정해진 것만 알아. 선생님께 물어봐!\n("뭐 할 수 있어?"라고 물으면 내가 아는 걸 알려 줄게.)', mood:'sad', known:false};
}

var EXAMPLES=['끝말잇기 하자','퀴즈 내 줘','아재개그 해 줘','(3+5)×2는?','둔각이 뭐야?','뭐 할 수 있어?'];

function renderRecords(){
  $('records').innerHTML='🏆 <b>내 기록</b><br>퀴즈 최고 <b>'+S.best.quiz+'</b>/5<br>끝말잇기 최고 <b>'+S.best.chain+'</b>번<br>오늘 질문 <b>'+S.hearts.used+'</b>번';
}
function histButton(c){
  var b=document.createElement('button'); b.className='hist'+(c.id===S.cur?' on':'');
  b.textContent=(c.mode?(c.mode.type==='chain'?'🔤 ':'❓ '):'💬 ')+c.title;
  b.addEventListener('click', function(){ SFX.click(); S.cur=c.id; save(); closeSide(); renderAll(); });

}
function renderHist(){
  var now=$('nowList'), box=$('histList'); now.innerHTML=''; box.innerHTML='';
  var list=S.chats.filter(function(c){ return c.msgs.length; });
  var cur=current();
  if(cur && cur.msgs.length) now.appendChild(histButton(cur));
  else { var p=document.createElement('div'); p.className='empty'; p.textContent='✨ 새 채팅'; now.appendChild(p); }

function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text.replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 ').replace(/−/g,' 빼기 ').replace(/[⭐🎉🏆✨💡]/g,''));
  u.lang=lang||'ko-KR'; u.rate=0.95; speechSynthesis.speak(u);
}

function aiRow(mood){
  var row=document.createElement('div'); row.className='row ai';
  var f=document.createElement('div'); f.className='face'; f.innerHTML=mascotSVG(mood||'hello'); row.appendChild(f);
  var b=document.createElement('div'); b.className='bubble'; row.appendChild(b);
  chatEl.appendChild(row); return {row:row, bubble:b, face:f};
}
function addTools(b, msg, live){
  if('speechSynthesis' in window){
    var s=document.createElement('button'); s.type='button'; s.className='say'; s.textContent='🔊'; s.setAttribute('aria-label','읽어 주기');
    s.addEventListener('click', function(){ speak(msg.text); });
    b.appendChild(s);
  }
  if(msg.opts && live){
    var box=document.createElement('div'); box.className='opts';
    makeChips(msg.opts, box, function(t){ box.querySelectorAll('button').forEach(function(x){ x.disabled=true; }); ask(t); });
    b.appendChild(box);
  }
}
function meRow(text){
  var row=document.createElement('div'); row.className='row me';
  var b=document.createElement('div'); b.className='bubble'; b.textContent=text; row.appendChild(b);
  chatEl.appendChild(row); scrollDown();
}
function scrollDown(){ chatEl.scrollTop=chatEl.scrollHeight; }

function renderChat(){
  chatEl.innerHTML='';
  var c=current();
  if(!c || !c.msgs.length){
    var h=document.createElement('div'); h.className='hello';
    h.innerHTML='<div class="mascot-big bob">'+mascotSVG('hello')+'</div><h2>무엇이 필요한가요.</h2><div class="chips" id="helloChips"></div>';
    chatEl.appendChild(h); makeChips(EXAMPLES, $('helloChips'));
    return;
  }
  c.msgs.forEach(function(m, idx){
    if(m.who==='me') return meRow(m.text);
    var r=aiRow(m.mood); r.bubble.textContent=m.text;
    if(m.end) r.bubble.classList.add('endcard');
    addTools(r.bubble, m, idx===c.msgs.length-1 && c.mode && c.mode.type==='quiz');
  });
  scrollDown();
}
function renderAll(){ renderHearts(); renderNick(); renderSound(); renderHist(); renderRecords(); renderChat(); }

/* 타자 치듯 글자 나오기 */
var typing=null;
function typeInto(el, text, done){
  var i=0, step=Math.max(1, Math.round(text.length/90)), speed=text.length>120?12:22;
  el.textContent=''; el.classList.add('caret');
  function finish(){ clearInterval(typing.t); el.textContent=text; el.classList.remove('caret'); typing=null; done(); }
  typing={finish:finish, t:setInterval(function(){
    i=Math.min(text.length, i+step); el.textContent=text.slice(0,i);
    if(i%6===0) scrollDown();
    if(i>=text.length) finish();
  }, speed)};
}

/* 마스코트 말풍선 (아이가 쓴 5가지 말) */
var popTimer=null, popTyper=null;
function mascotSay(kind, mood){
  var p=$('pop'), w=$('popWords'), txt=LINES[kind], i=0;
  $('popFace').innerHTML=mascotSVG(mood||({hello:'hello',good:'happy',wrong:'sad',stuck:'stuck',end:'party'})[kind], 'talk');
  p.classList.add('show'); clearInterval(popTyper); w.textContent='';
  popTyper=setInterval(function(){ i++; w.textContent=txt.slice(0,i); if(i>=txt.length) clearInterval(popTyper); }, 60);
  clearTimeout(popTimer); popTimer=setTimeout(function(){ p.classList.remove('show'); }, kind==='end'?4200:2800);
}

/* 반짝이 터지기 */
function sparkle(){
  var r=mainEl.getBoundingClientRect(), cx=r.width/2, cy=r.height*0.45, em=['⭐','✨','🌟','🎉'];
  for(var i=0;i<16;i++){
    var s=document.createElement('span'); s.className='spark'; s.textContent=em[i%em.length];
    s.style.left=cx+'px'; s.style.top=cy+'px'; mainEl.appendChild(s);
    var a=Math.random()*Math.PI*2, d=90+Math.random()*140;
    if(s.animate){
      s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:'translate('+(Math.cos(a)*d-12)+'px,'+(Math.sin(a)*d-12)+'px) scale(1.1) rotate('+(Math.random()*360)+'deg)',opacity:0}],{duration:900+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'});
    }
    (function(n){ setTimeout(function(){ n.remove(); }, 1300); })(s);
  }
}

/* 질문하기 */
var busy=false;
function ask(text){
  if(busy) return;
  text=(text||'').trim(); hideStuck();
  if(!text){ SFX.wrong(); mascotSay('wrong'); qEl.focus(); return; }
  if(S.hearts.left<=0){ mascotSay('end'); return; }
  var c=current();
  if(!c){ c={id:Date.now(), title:'', msgs:[], mode:null}; S.chats.unshift(c); S.cur=c.id; }
  if(!c.msgs.length){ chatEl.innerHTML=''; c.title=text.length>12?text.slice(0,12)+'…':text; }
  S.chats=S.chats.filter(function(x){ return x.id!==c.id; }); S.chats.unshift(c);
  if(S.chats.length>MAX_CHATS) S.chats=S.chats.slice(0,MAX_CHATS);
  c.msgs.push({who:'me', text:text});
  S.hearts.left--; S.hearts.used++;
  save(); SFX.send(); renderHearts(true); renderHist(); renderRecords();
  meRow(text); qEl.value='';
  busy=true;
  var r=aiRow('think'); r.bubble.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'; scrollDown();
  setTimeout(function(){
    var a=answer(text, c);
    var msg={who:'ai', text:a.text, mood:a.mood};
    if(a.opts) msg.opts=a.opts;
    c.msgs.push(msg); save(); renderHist(); renderRecords();
    r.face.innerHTML=mascotSVG(a.mood,'talk');
    SFX.recv();
    typeInto(r.bubble, a.text, function(){
      busy=false;
      addTools(r.bubble, msg, !!(a.opts && c.mode));
      scrollDown();
      if(a.party){ sparkle(); SFX.party(); }
      if(S.hearts.left<=0){ setTimeout(endOfDay, 500); }
      else if(a.known){ if(!a.party) SFX.good(); mascotSay('good', a.mood==='sad'?'happy':a.mood); }
      else { SFX.wrong(); mascotSay('wrong','sad'); }
      resetIdle();
    });
  }, 700+Math.random()*500);
}
function endOfDay(){
  var c=current(); if(!c) return;
  var text='🎉 오늘 사용량을 다 썼어요!\n\n오늘 질문 '+S.hearts.used+'번 · 퀴즈 최고 '+S.best.quiz+'/5 · 끝말잇기 최고 '+S.best.chain+'번\n\n진짜 AI였다면 질문 '+S.hearts.used+'번 모두 돈이 들었을 거예요.\n내일 다시 하트가 가득 채워져요!';
  var msg={who:'ai', text:text, mood:'party', end:true};
  c.mode=null; c.msgs.push(msg); save();
  var r=aiRow('party'); r.bubble.classList.add('endcard');
  typeInto(r.bubble, text, function(){ addTools(r.bubble, msg, false); scrollDown(); });
  SFX.end(); mascotSay('end'); sparkle();
}

chatEl.addEventListener('click', function(e){ if(typing && e.target.closest('.bubble')) typing.finish(); });

$('nickForm').addEventListener('submit', function(e){
  e.preventDefault();
  var first=!S.nick;
  S.nick=$('nickInput').value.trim().slice(0,8)||'친구'; save(); renderNick();
  $('nickModal').classList.remove('show');
  if(first){ SFX.good(); setTimeout(function(){ mascotSay('hello'); }, 200); }
  qEl.focus();
});

/* 🧾 만든 기록 */
function fmtTokens(t){ return t>=10000?(Math.round(t/1000)/10).toLocaleString('ko-KR')+'만 개':t.toLocaleString('ko-KR')+'개'; }
function renderReceipt(r){
  var body=$('receiptBody'); body.innerHTML='';
  var wait='계산 중', dl=document.createElement('dl');
  [['작품',r.title||'free ai'],
   ['AI가 일한 시간', r.minutes==null?wait:r.minutes+'분'],
   ['주고받은 글자 조각(토큰)', r.tokens==null?wait:fmtTokens(r.tokens)],
   ['돈으로 치면', r.won==null?wait:'약 '+Number(r.won).toLocaleString('ko-KR')+'원'],
   ['고친 횟수', r.revisions==null?wait:r.revisions+'번']
  ].forEach(function(p){ var dt=document.createElement('dt'); dt.textContent=p[0]; var dd=document.createElement('dd'); dd.textContent=p[1]; dl.appendChild(dt); dl.appendChild(dd); });
  body.appendChild(dl);
  if(r.priceNote){ var pn=document.createElement('p'); pn.className='pn'; pn.textContent='※ '+r.priceNote; body.appendChild(pn); }
  function list(title, items, fn){
    if(!items || !items.length) return;
    var h=document.createElement('h3'); h.textContent=title; body.appendChild(h);
    var ul=document.createElement('ul');
    items.forEach(function(it){ var li=document.createElement('li'); fn(li,it); ul.appendChild(li); });
    body.appendChild(ul);
  }
  list('🤖 AI 혼자서는 못 해서 사람이 정한 것', r.aiCouldNot, function(li,it){ li.textContent=it; });
  list('💰 더 하고 싶지만 돈·준비가 더 드는 것', r.costsMore, function(li,it){
    var b=document.createElement('b'); b.textContent=(it.feature||'')+' — '; li.appendChild(b);
    li.appendChild(document.createTextNode(it.why||''));
  });
}
$('receiptBtn').addEventListener('click', function(){
  SFX.click();
  $('receiptModal').classList.add('show'); $('receiptBody').textContent='불러오는 중…';
  fetch('receipt.json',{cache:'no-store'})
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(renderReceipt)
    .catch(function(){ $('receiptBody').textContent='기록을 불러오지 못했어요. 인터넷 주소(웹사이트)로 열면 보여요.'; });
});
$('receiptClose').addEventListener('click', function(){ $('receiptModal').classList.remove('show'); });
$('receiptModal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });

/* 시작 */
renderAll();
if(!S.nick) openNick(); else setTimeout(function(){ mascotSay('hello'); }, 400);
resetIdle();
})();
</script>
