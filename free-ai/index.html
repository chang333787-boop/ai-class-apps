<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>free ai</title>
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --side:#eaf1fb; --ink:#1f2937; --sub:#6b7280;
  --line:#d6e0ee; --accent:#2563eb; --accent-soft:#dbeafe; --me:#2563eb; --ai:#ffffff;
  --heart:#ef4444; --shadow:0 4px 0 #d6e0ee;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}

/* 위쪽 띠 */
.top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:2px solid var(--line)}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.btn:active{transform:translateY(2px)}
.menu-btn{display:none}
.logo{flex:1;text-align:center;font-weight:800;font-size:26px;letter-spacing:.5px}
.logo small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:0}
.hearts{font-size:17px;white-space:nowrap;font-weight:700;color:var(--heart)}
.nick{border:none;background:none;font-size:17px;color:var(--sub);padding:8px 4px;min-height:44px}

/* 왼쪽 메뉴 */
.side{background:var(--side);border-right:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side .brand{font-weight:800;font-size:22px;padding:6px 8px}
.side .new{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:18px;text-align:left;font-weight:700;box-shadow:var(--shadow)}
.side h3{margin:12px 8px 0;font-size:15px;color:var(--sub)}
.hist{background:none;border:none;text-align:left;padding:12px 10px;border-radius:12px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
.hist.on{background:#fff;font-weight:700}
.side .empty{color:var(--sub);font-size:15px;padding:4px 10px}
.side .nick-side{display:none;text-align:left}

/* 가운데 */
.main{display:flex;flex-direction:column;min-height:0;position:relative}
.chat{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
.hello{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.hello h2{font-size:clamp(26px,4vw,36px);margin:4px 0}
.hello .mascot-big{width:min(260px,62vw)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:17px;min-height:44px}
.chip:active{background:var(--accent-soft)}
.row{display:flex;gap:8px;align-items:flex-end;max-width:760px;width:100%;margin:0 auto}
.row.me{justify-content:flex-end}
.bubble{padding:12px 16px;border-radius:18px;max-width:78%;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:6px}
.ai .bubble{background:var(--ai);border:2px solid var(--line);border-bottom-left-radius:6px}
.ai .face{width:40px;flex:none}
.say{border:none;background:var(--accent-soft);border-radius:10px;padding:6px 10px;margin-left:6px;font-size:16px;vertical-align:middle;min-height:36px}
.thinking{color:var(--sub);font-style:italic}

/* 아래 입력창 */
.bottom{padding:8px 16px 10px}
.bottom .chips{margin:0 auto 8px;max-width:760px}
.ask{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto;background:#fff;border:3px solid #1f2937;border-radius:999px;padding:6px 6px 6px 20px}
.ask input{flex:1;border:none;outline:none;font-size:19px;padding:10px 0;background:transparent;min-width:0}
.send{width:52px;height:52px;border-radius:50%;border:3px solid #1f2937;background:#fff;font-size:24px;font-weight:800;flex:none}
.send:disabled,.ask input:disabled{opacity:.45;cursor:not-allowed}
.note{text-align:center;color:var(--sub);font-size:14px;margin-top:6px}

/* 마스코트 말풍선 (오른쪽 아래) */
.pop{position:absolute;right:14px;bottom:110px;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;z-index:5}
.pop.show{opacity:1;transform:none}
.pop .words{background:#fff;border:3px solid #1f2937;border-radius:16px;padding:10px 14px;font-size:20px;font-weight:800;margin-bottom:40px}
.pop svg{width:120px}

/* 창(모달) */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;padding:22px;width:min(460px,100%);max-height:90vh;overflow-y:auto}
.box h2{margin:0 0 12px;font-size:24px}
.box input{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:12px}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.box .go{background:var(--accent);color:#fff;border-color:var(--accent)}
.rc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:17px}
.rc dt{color:var(--sub)}
.rc dd{margin:0;font-weight:700}
.rc h3{font-size:18px;margin:14px 0 6px}
.rc ul{margin:0;padding-left:20px;line-height:1.6;font-size:16px}
.rc li{margin-bottom:6px}

/* 좁은 화면(크롬북 세로·태블릿) */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .top{grid-column:1}
  .menu-btn{display:inline-flex}
  .side{position:fixed;top:0;left:0;bottom:0;width:240px;z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .top{flex-wrap:wrap;row-gap:4px}
  .logo{font-size:22px;order:-1;flex-basis:100%}
  .logo small{display:none}
  .btn{padding:8px 10px;font-size:16px}
  .top .nick{display:none}
  .side .nick-side{display:block}
  .hearts{margin-left:auto}
  body{overflow-x:hidden}
  .pop{bottom:120px}
  .pop svg{width:90px}
}
</style>
</head>

<div class="modal" id="nickModal">

    <input id="nickInput" maxlength="8" placeholder="예) 질문왕">
    <div class="acts"><button type="submit" class="btn go">시작하기</button></div>
  </form>
</div>

<div class="modal" id="receiptModal">
  <div class="box rc">
    <h2>🧾 만든 기록</h2>

    <div class="acts"><button class="btn" id="receiptClose">닫기</button></div>

<script>

/* ---------- 저장 (부품 15: 저장 = 기억하기) ---------- */
var KEY = 'freeai.v1';

/* ---------- 연습용 AI 대답 (키 없음, 기기 안에서만) ---------- */

function has(q, list){ for(var i=0;i<list.length;i++) if(q.indexOf(list[i])>=0) return true; return false; }
function fmtNum(n){ return Math.round(n*1000)/1000; }

function answer(raw){
  var q = raw.trim().toLowerCase().replace(/\s+/g,' ');
  if(!q) return null;
  var nos = q.replace(/\s/g,'');
  if(/\d{2,3}-?\d{3,4}-?\d{4}/.test(nos)) return {text:'전화번호 같은 건 여기에 쓰지 마! 내 정보는 소중하니까.', known:true};

  // 구구단: "3단"
  var m = nos.match(/([1-9])단/);
  if(m){
    var n=+m[1], out=[]; for(var i=1;i<=9;i++) out.push(n+' × '+i+' = '+(n*i));

  // 계산
  var e = nos.replace(/더하기|플러스/g,'+').replace(/빼기|마이너스/g,'-').replace(/곱하기|×|x|\*/g,'*').replace(/나누기|÷|\//g,'/');
  m = e.match(/(\d+(?:\.\d+)?)([+\-*\/])(\d+(?:\.\d+)?)/);
  if(m){
    var a=+m[1], b=+m[3], op=m[2], r;
    if(op==='/' && b===0) return {text:'어 0으로는 나눌 수 없어!', known:true};
    r = op==='+'?a+b : op==='-'?a-b : op==='*'?a*b : a/b;
    var sym = {'+':'+','-':'−','*':'×','/':'÷'}[op];
    return {text:'어 '+m[1]+' '+sym+' '+m[3]+' = '+fmtNum(r)+' 이야!', known:true};
  }
  if(has(nos,['안녕','하이','hello','hi','반가워'])) return {text:'어 안녕! 나는 free ai야. 궁금한 걸 물어봐.', known:true};

  if(has(nos,['뭐할수','할수있','뭘할수','도움말','사용법'])) return {text:'어 나는 이런 걸 할 수 있어!\n· 인사하기\n· 오늘 날짜·요일·시간\n· 계산 (예: 12 곱하기 4)\n· 구구단 (예: 7단)\n· 낱말 뜻 (예: 분수가 뭐야?)\n· 아재개그\n· 공부 팁', known:true};
  var d=new Date(), wk='일월화수목금토'.charAt(d.getDay());
  if(has(nos,['몇시','시간','시각'])) return {text:'어 지금은 '+d.getHours()+'시 '+d.getMinutes()+'분이야.', known:true};
  if(has(nos,['요일'])) return {text:'어 오늘은 '+wk+'요일이야.', known:true};
  if(has(nos,['날짜','며칠','몇월','오늘'])) return {text:'어 오늘은 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+wk+'요일이야.', known:true};
  if(has(nos,['날씨'])) return {text:'어 나는 바깥을 못 봐서 날씨는 몰라. 창문을 한번 봐!', known:true};
  if(has(nos,['개그','농담','웃긴','재밌는','재미있는','수수께끼','퀴즈'])) return {text:pick(JOKES), known:true};
  if(has(nos,['공부','받아쓰기','숙제','정리','집중','외우'])) return {text:pick(TIPS), known:true};
  for(var w in WORDS){ if(nos.indexOf(w)>=0) return {text:'어 \''+w+'\'(이)란 '+WORDS[w], known:true}; }
  return {text:'어 그건 아직 몰라. 나는 연습용 AI라서 정해진 것만 알아. 선생님께 물어봐!\n("뭐 할 수 있어?"라고 물으면 내가 아는 걸 알려 줄게.)', known:false};
}

/* ---------- 화면 ---------- */
var $ = function(id){ return document.getElementById(id); };
var chatEl=$('chat'), qEl=$('q'), sendBtn=$('sendBtn');
var EXAMPLES = ['뭐 할 수 있어?','12 곱하기 4는?','아재개그 해 줘','분수가 뭐야?'];

function chipsHTML(list, box){
  box.innerHTML='';
  list.forEach(function(t){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=t;
    b.addEventListener('click', function(){ ask(t); });
    box.appendChild(b);
  });
}

function renderHearts(){
  var left=S.hearts.left;
  $('hearts').textContent = '❤️ '+left+'/'+DAILY;
  var out = left<=0;
  qEl.disabled=out; sendBtn.disabled=out;
  qEl.placeholder = out ? '오늘은 끝! 내일 다시 하트가 채워져요' : '질문 쓰는데';
}

function renderNick(){ $('nickBtn').textContent = $('nickBtn2').textContent = '('+(S.nick||'친구')+')'; }

function renderHist(){
  var box=$('histList'); box.innerHTML='';
  var list=S.chats.filter(function(c){ return c.msgs.length; });
  if(!list.length){ var p=document.createElement('div'); p.className='empty'; p.textContent='아직 없어요'; box.appendChild(p); return; }
  list.forEach(function(c){
    var b=document.createElement('button'); b.className='hist'+(c.id===S.cur?' on':''); b.textContent='💬 '+c.title;
    b.addEventListener('click', function(){ S.cur=c.id; save(); closeSide(); renderAll(); });
    box.appendChild(b);
  });
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text.replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 ').replace(/−/g,' 빼기 '));
  u.lang='ko-KR'; u.rate=0.95;
  speechSynthesis.speak(u);
}

function bubble(who, text, thinking){
  var row=document.createElement('div'); row.className='row '+who;
  if(who==='ai'){ var f=document.createElement('div'); f.className='face'; f.innerHTML=mascotSVG('hello'); row.appendChild(f); }
  var b=document.createElement('div'); b.className='bubble'+(thinking?' thinking':''); b.textContent=text;
  if(who==='ai' && !thinking && ('speechSynthesis' in window)){
    var s=document.createElement('button'); s.type='button'; s.className='say'; s.textContent='🔊'; s.setAttribute('aria-label','읽어 주기');
    s.addEventListener('click', function(){ speak(text); });
    b.appendChild(s);
  }
  row.appendChild(b); chatEl.appendChild(row);
  chatEl.scrollTop=chatEl.scrollHeight;
  return row;
}

function renderChat(){
  chatEl.innerHTML='';
  var c=current();
  if(!c || !c.msgs.length){
    var h=document.createElement('div'); h.className='hello';
    h.innerHTML='<div class="mascot-big">'+mascotSVG('hello')+'</div><h2>무엇이 필요한가요.</h2><div class="chips" id="helloChips"></div>';
    chatEl.appendChild(h);
    chipsHTML(EXAMPLES, $('helloChips'));
    return;
  }
  c.msgs.forEach(function(m){ bubble(m.who, m.text); });
}

function renderAll(){ renderHearts(); renderNick(); renderHist(); renderChat(); }

/* 마스코트 말풍선 */
var popTimer=null;
function mascotSay(kind){
  $('popWords').textContent=LINES[kind];
  $('popFace').innerHTML=mascotSVG(kind);
  var p=$('pop'); p.classList.add('show');
  clearTimeout(popTimer); popTimer=setTimeout(function(){ p.classList.remove('show'); }, kind==='end'?4000:2600);
}

/* 질문하기 */
var busy=false;
function ask(text){
  if(busy) return;
  text=(text||'').trim();
  hideStuck();
  if(!text){ mascotSay('wrong'); qEl.focus(); return; }
  if(S.hearts.left<=0){ mascotSay('end'); return; }
  var c=current();
  if(!c){ c={id:Date.now(), title:'', msgs:[]}; S.chats.unshift(c); S.cur=c.id; }
  if(!c.msgs.length){ chatEl.innerHTML=''; c.title=text.length>12?text.slice(0,12)+'…':text; }
  // 이 대화를 맨 위로, 5개까지만 기억
  S.chats=S.chats.filter(function(x){ return x.id!==c.id; }); S.chats.unshift(c);
  if(S.chats.length>MAX_CHATS) S.chats=S.chats.slice(0,MAX_CHATS);
  c.msgs.push({who:'me', text:text});
  S.hearts.left--;
  save(); renderHearts(); renderHist();
  bubble('me', text);
  qEl.value='';
  busy=true;
  var t=bubble('ai','생각 중…',true);
  setTimeout(function(){
    busy=false;
    t.remove();
    var r=answer(text);
    c.msgs.push({who:'ai', text:r.text}); save();
    bubble('ai', r.text);
    if(S.hearts.left<=0){ renderHearts(); setTimeout(function(){ mascotSay('end'); }, 300); }
    else mascotSay(r.known?'good':'wrong');
    resetIdle();
  }, 600);
}

$('askForm').addEventListener('submit', function(e){ e.preventDefault(); ask(qEl.value); });

/* 새 채팅 */
$('newBtn').addEventListener('click', function(){
  S.cur=null; save();
  closeSide(); renderAll(); qEl.focus();
});

/* 막혔을 때: 20초 동안 아무것도 안 쓰면 */
var idleTimer=null;
function hideStuck(){ $('stuckChips').hidden=true; }
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){
    if(S.hearts.left<=0 || qEl.value.trim() || document.querySelector('.modal.show')) { resetIdle(); return; }
    mascotSay('stuck');
    var c=current();
    if(c && c.msgs.length){ chipsHTML(EXAMPLES, $('stuckChips')); $('stuckChips').hidden=false; }
  }, 20000);
}
['input','pointerdown','keydown'].forEach(function(ev){ document.addEventListener(ev, resetIdle, {passive:true}); });

/* 왼쪽 메뉴 (좁은 화면) */
function closeSide(){ $('side').classList.remove('open'); }
$('menuBtn').addEventListener('click', function(){ $('side').classList.toggle('open'); });
chatEl.addEventListener('click', closeSide);

/* 별명 */
function openNick(){ $('nickInput').value=S.nick||''; $('nickModal').classList.add('show'); setTimeout(function(){ $('nickInput').focus(); },50); }
$('nickBtn').addEventListener('click', openNick);
$('nickBtn2').addEventListener('click', function(){ closeSide(); openNick(); });
$('nickForm').addEventListener('submit', function(e){
  e.preventDefault();
  var v=$('nickInput').value.trim().slice(0,8);
  var first=!S.nick;
  S.nick=v||'친구'; save(); renderNick();
  $('nickModal').classList.remove('show');
  if(first) setTimeout(function(){ mascotSay('hello'); }, 200);
  qEl.focus();
});

/* 🧾 만든 기록 */
function fmtTokens(t){ return t>=10000 ? (Math.round(t/1000)/10)+'만 개' : t.toLocaleString('ko-KR')+'개'; }
function renderReceipt(r){
  var body=$('receiptBody'); body.innerHTML='';
  var wait='계산 중';
  var dl=document.createElement('dl');
  [['작품',r.title||'free ai'],
   ['AI가 일한 시간', r.minutes==null?wait:r.minutes+'분'],
   ['주고받은 글자 조각(토큰)', r.tokens==null?wait:fmtTokens(r.tokens)],
   ['돈으로 치면', r.won==null?wait:'약 '+Number(r.won).toLocaleString('ko-KR')+'원'],
   ['고친 횟수', (r.revisions==null?wait:r.revisions+'번')]
  ].forEach(function(p){ var dt=document.createElement('dt'); dt.textContent=p[0]; var dd=document.createElement('dd'); dd.textContent=p[1]; dl.appendChild(dt); dl.appendChild(dd); });
  body.appendChild(dl);
  function list(title, items, fn){
    if(!items || !items.length) return;
    var h=document.createElement('h3'); h.textContent=title; body.appendChild(h);
    var ul=document.createElement('ul');
    items.forEach(function(it){ var li=document.createElement('li'); fn(li,it); ul.appendChild(li); });
    body.appendChild(ul);
  }
  list('🤖 AI 혼자서는 못 해서 사람이 정한 것', r.aiCouldNot, function(li,it){ li.textContent=it; });
  list('💰 더 하고 싶지만 돈·준비가 더 드는 것', r.costsMore, function(li,it){
    var b=document.createElement('b'); b.textContent=(it.feature||'')+' — '; li.appendChild(b);
    li.appendChild(document.createTextNode(it.why||''));
  });
}
$('receiptBtn').addEventListener('click', function(){
  $('receiptModal').classList.add('show');
  $('receiptBody').textContent='불러오는 중…';
  fetch('receipt.json',{cache:'no-store'})
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(renderReceipt)
    .catch(function(){ $('receiptBody').textContent='기록을 불러오지 못했어요. 인터넷 주소(웹사이트)로 열면 보여요.'; });
});
$('receiptClose').addEventListener('click', function(){ $('receiptModal').classList.remove('show'); });
$('receiptModal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });

/* 시작 */
renderAll();
if(!S.nick) openNick(); else setTimeout(function(){ mascotSay('hello'); }, 300);
resetIdle();
})();
</script>
</body>
</html>
