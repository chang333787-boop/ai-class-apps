<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>체리의 이야기 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4ee; --ink:#3a2a2a; --sub:#7a6a66; --line:#f2c6cd; --paper:#fffaf0;
  --cherry:#e2384d; --cherry-d:#b0213a; --pink:#ffe1e6; --leaf:#3a9a4a; --gold:#ffc83a;
  --round:"Jua",system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);word-break:keep-all;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  background:var(--bg) radial-gradient(circle at 12% 18%,#ffe3ea 0 60px,transparent 61px),
    radial-gradient(circle at 88% 82%,#ffe9d6 0 90px,transparent 91px);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
.press{transition:transform .08s}
.press:active:not(:disabled){transform:scale(.94) translateY(2px)}
h1,h2,h3,.round{font-family:var(--round);font-weight:400}

/* 구석 버튼 */
.corner{position:fixed;top:10px;z-index:40;height:48px;padding:0 16px;border-radius:16px;background:#fff;border:3px solid var(--line);
  font-size:18px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:6px}
.corner:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.home-link{left:10px}
.receipt-btn{right:10px}
.sound-btn{right:168px;width:52px;justify-content:center;padding:0;font-size:22px}

.screen{display:none;min-height:100vh;padding:72px 16px 24px}
.screen.on{display:block;animation:screenIn .4s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wrap{max-width:1100px;margin:0 auto}

/* 버튼 */
.go{background:var(--cherry);color:#fff;border:0;border-radius:18px;padding:14px 28px;font-size:24px;font-family:var(--round);
  box-shadow:0 5px 0 var(--cherry-d);transition:transform .08s,box-shadow .08s}
.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cherry-d)}
.ghost{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 22px;font-size:21px;font-family:var(--round);
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* 마스코트 공통 */
.mascot{position:relative}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bob svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.jump{animation:jump .7s ease}
@keyframes jump{25%{transform:translateY(-26px) scale(1.04)}55%{transform:translateY(0) scale(1,.94)}75%{transform:translateY(-9px)}}
.tilt{animation:tilt .8s ease}
@keyframes tilt{25%{transform:rotate(-10deg)}70%{transform:rotate(7deg)}}
.spin{animation:spin .9s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:22px;
  line-height:1.45;min-height:58px;text-align:center;font-family:var(--round);box-shadow:0 5px 0 #0001}
.bubble.up::before,.bubble.up::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:12px solid transparent;border-top:0}
.bubble.up::before{top:-16px;border-bottom:16px solid var(--ink)}
.bubble.up::after{top:-10px;border-bottom:13px solid #fff;border-width:0 9px 13px}

/* ===== 제목 화면 ===== */
.title-wrap{max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{font-family:var(--round);font-size:clamp(40px,8vw,72px);line-height:1.1;margin:6px 0 0;color:var(--cherry);
  text-shadow:4px 4px 0 #fff,7px 7px 0 var(--line)}
.logo small{display:block;font-size:.42em;color:var(--ink);text-shadow:none;margin-top:6px}
#titleCherry{width:min(250px,60vw);height:min(310px,74vw)}
.title-bubble{max-width:520px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:18px}
.stats span{background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 14px}

/* ===== 게임판 ===== */
.board{border:4px solid var(--ink);border-radius:48px 40px 52px 44px;background:#fff;padding:20px;
  display:grid;grid-template-columns:150px 1fr 1.1fr;gap:18px;align-items:stretch;box-shadow:0 8px 0 var(--line)}
.deco-btn{border:4px solid var(--ink);background:var(--pink);border-radius:20px;font-size:23px;font-family:var(--round);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 8px;line-height:1.25;box-shadow:0 5px 0 var(--line)}
.deco-btn svg{width:64px;height:64px}
.mascot-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mascot-ring{width:min(230px,100%);aspect-ratio:1;border:4px dashed var(--line);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#fff 52%,#ffeef1 100%);position:relative}
.mascot-ring .tag{position:absolute;top:-16px;background:#fff;padding:0 10px;font-size:17px;color:var(--sub);font-family:var(--round)}
#homeCherry{width:72%;height:86%}
.mascot-zone .bubble{max-width:330px;font-size:20px}
.right-col{display:flex;flex-direction:column;gap:12px}
.lv-name{font-size:21px;font-family:var(--round);display:flex;align-items:center;gap:8px}
.lv-badge{background:var(--cherry);color:#fff;border-radius:12px;padding:2px 10px}
.lv-bar{height:28px;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;margin-top:6px}
.lv-fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,#ff6f86 0 12px,var(--cherry) 12px 24px);transition:width .9s cubic-bezier(.3,1.4,.5,1)}
.lv-sub{font-size:16px;color:var(--sub);margin-top:4px}
.q-box{flex:1;border:4px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;position:relative;min-height:210px;background:var(--paper)}
.q-box .lbl{position:absolute;top:8px;left:12px;font-size:17px;color:var(--sub);font-family:var(--round)}
.q-box .cover{width:110px;height:84px;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}
.q-box .cover svg{width:100%;height:100%;display:block}
.q-box .ttl{font-size:25px;font-family:var(--round)}
.q-box .meta{font-size:17px;color:var(--sub)}
.band{margin-top:34px;border:4px solid var(--ink);border-radius:20px;background:#fff;padding:24px 16px 16px;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 6px 0 var(--line)}
.band .tab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--gold);border:4px solid var(--ink);
  border-radius:16px;padding:2px 24px;font-size:22px;font-family:var(--round)}
.slots{display:flex;gap:10px;border:4px solid var(--ink);border-radius:16px;padding:12px;flex-wrap:wrap;background:var(--paper)}
.slot{width:66px;height:88px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;border:4px solid var(--ink);background:#fff;
  font-size:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0;transition:transform .15s}
.slot small{font-size:12px;line-height:1.1}
.slot.sel{background:var(--pink);transform:translateY(-6px);box-shadow:0 6px 0 var(--cherry)}
.slot.locked{color:#aaa;border-style:dashed;border-color:#bbb}
.slot .stars{position:absolute;bottom:-12px;font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 3px;white-space:nowrap}
.flip{display:flex;align-items:center;gap:10px}
.arrow{width:66px;height:66px;border:0;background:none;padding:0}
.arrow svg{width:100%;height:100%}
.arrow:disabled{opacity:.25}
.flip .mid{border:4px solid var(--ink);border-radius:12px;padding:4px 14px;font-size:19px;font-family:var(--round);background:#fff}

/* ===== 그림책 ===== */
.book-top{max-width:1100px;margin:0 auto 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.book-top h2{margin:0;font-size:28px;color:var(--cherry-d)}
.book{position:relative;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  border:4px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 #e6cfae,0 16px 30px #0002;perspective:1800px;min-height:430px}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:40px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,#0000001c 45%,#0000002a 50%,#0000001c 55%,transparent)}
.pg-left{padding:18px;display:flex;align-items:center;justify-content:center;border-right:2px solid #e9dcc4}
.pg-left svg{width:100%;height:auto;border-radius:14px;border:3px solid var(--ink);background:#fff;display:block}
.pg-right{padding:24px 26px 18px;display:flex;flex-direction:column}
.pg-no{font-size:17px;color:var(--sub);font-family:var(--round)}
.pg-text{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  font-family:var(--round);font-size:clamp(28px,3.4vw,38px);line-height:1.55}
.pg-text .end{font-size:24px;color:var(--cherry-d)}
.read-btn{align-self:center;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 20px;font-size:21px;font-family:var(--round);
  box-shadow:0 4px 0 var(--line)}
.read-btn.on{background:var(--gold)}
.choices{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
.choice{border:4px solid var(--ink);background:var(--pink);border-radius:20px;padding:14px 18px;font-size:26px;font-family:var(--round);box-shadow:0 5px 0 var(--line)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.book-nav{max-width:1100px;margin:16px auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet{position:absolute;top:-4px;bottom:-4px;left:50%;width:50%;transform-origin:left center;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,#f3e6cc,var(--paper) 30%,#fff 70%,#efe0c4);border:4px solid var(--ink);border-left:0;border-radius:0 22px 22px 0;
  animation:turn .62s cubic-bezier(.45,.05,.4,1) forwards}
.sheet.back{left:0;transform-origin:right center;border-left:4px solid var(--ink);border-right:0;border-radius:22px 0 0 22px;animation-name:turnBack}
@keyframes turn{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnBack{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.rain line{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.wag{transform-box:fill-box;transform-origin:100% 100%;animation:wag 1.2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
.float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}

/* ===== 문제 ===== */
.panel{max-width:820px;margin:0 auto;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:24px 22px;min-height:440px;
  display:flex;flex-direction:column;box-shadow:0 8px 0 var(--line)}
.panel h2{margin:0;font-size:26px;color:var(--cherry-d)}
.quiz-q{font-size:clamp(28px,3.6vw,36px);text-align:center;margin:20px 0 14px;line-height:1.45;font-family:var(--round)}
.opts{display:grid;gap:14px;max-width:540px;margin:0 auto;width:100%}
.opt{border:4px solid var(--ink);background:#fff;border-radius:18px;padding:16px;font-size:28px;font-family:var(--round);box-shadow:0 5px 0 var(--line);position:relative}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.right{background:#d6f5d9;border-color:var(--leaf);box-shadow:0 5px 0 #9ad3a0}
.opt.wrong{background:#ffe1e1;border-color:#d33;color:#a33;animation:shake .4s}
.opt.wrong::after{content:"✖";position:absolute;right:18px}
.opt.right::after{content:"⭕";position:absolute;right:16px}
.opt:disabled:not(.right):not(.wrong){opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.side-mascot{position:fixed;right:12px;bottom:10px;display:flex;align-items:flex-end;gap:8px;z-index:20;pointer-events:none}
.side-mascot[hidden]{display:none}
#sideCherry{width:120px;height:150px}
.side-mascot .bubble{font-size:19px;max-width:270px;margin-bottom:40px}
.side-mascot .bubble::before,.side-mascot .bubble::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:12px solid transparent;border-right:0}
.side-mascot .bubble::before{right:-17px;border-left:16px solid var(--ink)}
.side-mascot .bubble::after{right:-10px;border-left:13px solid #fff;border-width:9px 0 9px 13px}

/* ===== 결과 ===== */
.result{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;max-width:860px;margin:0 auto;background:#fff;
  border:4px solid var(--ink);border-radius:28px;padding:24px;box-shadow:0 8px 0 var(--line)}
#resCherry{width:200px;height:250px;margin:0 auto}
.res-main{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res-main h2{margin:0;font-size:32px}
.big-stars{display:flex;gap:10px;font-size:64px;line-height:1}
.big-stars span{opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.big-stars span.lit{opacity:1;filter:none;transform:scale(1)}
.xp-line{font-size:26px;font-family:var(--round)}
.xp-line b{color:var(--cherry);font-size:34px}
.res-main .lv-bar{width:min(420px,90%)}
.res-main .bubble{max-width:440px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ===== 옷장 ===== */
.closet{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:22px;max-width:1000px;margin:0 auto;align-items:start}
.closet .preview{background:#fff;border:4px solid var(--ink);border-radius:28px;padding:16px;text-align:center;position:relative;box-shadow:0 8px 0 var(--line)}
.closet .preview h2{margin:0 0 6px;font-size:28px}
#closetCherry{width:min(240px,70vw);height:min(300px,88vw);margin:0 auto}
.closet .bubble{font-size:19px;margin:8px 0 12px}
.rack{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 0 var(--line)}
.rack h3{margin:0 0 10px;font-size:23px}
.items{display:flex;gap:12px;flex-wrap:wrap}
.item{width:100px;min-height:104px;border:4px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:17px;padding:6px;font-family:var(--round)}
.item svg{width:52px;height:52px}
.item.on{border-color:var(--cherry);background:var(--pink);box-shadow:0 4px 0 var(--cherry)}
.item.lock{color:#999;background:#f4f4f4;font-size:14px}
.item.lock svg{opacity:.25;filter:grayscale(1)}
.item.nope{animation:shake .4s}

/* ===== 창 · 효과 ===== */
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal .box{background:#fff;border:4px solid var(--ink);border-radius:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;position:relative}
.modal h2{margin:0 0 12px;font-size:26px}
.modal .x{position:absolute;top:10px;right:10px;border:0;background:#f2f2f2;border-radius:12px;width:46px;height:46px;font-size:22px}
.rc-nums{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:19px;background:#fff8ee;border-radius:14px;padding:12px 14px}
.rc-nums b{text-align:right}
.rc-note{font-size:14px;color:var(--sub);margin:6px 2px 0}
.modal h3{font-size:21px;margin:16px 0 6px}
.modal ul{margin:0;padding-left:22px;font-size:18px;line-height:1.6}
/* 레벨 업 */
#levelUp .box{text-align:center;overflow-y:auto;max-width:520px;padding:26px 22px}
.rays-wrap{position:absolute;inset:0;overflow:hidden;border-radius:20px;z-index:0}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(#fff3c4 0 10deg,#fff 10deg 20deg);animation:rays 8s linear infinite;z-index:0}
@keyframes rays{to{transform:rotate(360deg)}}
#levelUp .in,#rebirth .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
#rebirth .box{text-align:center;overflow-y:auto;max-width:520px;padding:26px 22px}
.rays-violet{background:repeating-conic-gradient(#efe4ff 0 10deg,#fff 10deg 20deg)}
.rb-title{font-family:var(--round);font-size:46px;color:#7a4fd6;text-shadow:3px 3px 0 #fff,6px 6px 0 #ffd23a;animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
.rb-text{font-size:21px;line-height:1.6;font-family:var(--round)}
#rbCherry{width:120px;height:150px}
.rebirth-btn{background:linear-gradient(90deg,#9b6ad6,#e2384d);box-shadow:0 5px 0 #6a3fb0;font-size:20px;padding:10px 20px;margin-top:6px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.15);transform:scale(1.04)}}
#closetRebirth{margin-bottom:10px}
.item.special:not(.lock){border-color:#c7a2ff}
.rb-stars{color:#7a4fd6;font-family:var(--round)}
.lu-title{font-family:var(--round);font-size:54px;color:var(--cherry);text-shadow:3px 3px 0 #fff,6px 6px 0 var(--gold);animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.2)}}
.lu-num{font-family:var(--round);font-size:30px;display:flex;align-items:center;gap:12px}
.lu-num .n{display:inline-block;background:var(--cherry);color:#fff;border-radius:16px;padding:2px 16px;font-size:44px;min-width:70px}
.lu-num .n.roll{animation:roll .5s ease}
@keyframes roll{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-30px) scale(.6);opacity:0}55%{transform:translateY(30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
#luCherry{width:120px;height:150px}
.lu-items{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:420px}
.lu-items span{background:#fff;border:3px solid var(--ink);border-radius:14px;width:56px;height:56px;display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.8,.5,1) backwards}
.lu-items svg{width:40px;height:40px}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:16px;
  font-size:20px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw;font-family:var(--round)}
.toast.on{opacity:1}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.spark{position:fixed;z-index:65;pointer-events:none;font-size:26px;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.plus{position:fixed;z-index:65;pointer-events:none;font-family:var(--round);font-size:30px;color:var(--cherry);text-shadow:2px 2px 0 #fff;animation:plus 1.2s ease-out forwards}
@keyframes plus{to{transform:translateY(-70px);opacity:0}}

@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr;border-radius:30px}
  .mascot-zone{grid-column:1/-1;order:-1}
  .deco-btn{flex-direction:row;font-size:21px}
  .deco-btn svg{width:46px;height:46px}
  .book{grid-template-columns:1fr;min-height:0}
  .book::after{display:none}
  .pg-left{border-right:0;border-bottom:2px solid #e9dcc4;padding:12px}
  .pg-right{padding:16px}
  .sheet,.sheet.back{left:0;width:100%;transform-origin:left center;border:4px solid var(--ink);border-radius:22px;animation-name:turn}
  .closet{grid-template-columns:1fr}
  .result{grid-template-columns:1fr}
  #resCherry{width:150px;height:185px}
  #sideCherry{width:84px;height:105px}
  .side-mascot .bubble{font-size:16px;max-width:200px;margin-bottom:24px}

<script>
"use strict";
/* =========================================================
   체리가 하는 말 — 기획서에 쓴 말 그대로 (띄어쓰기만 고침)
   ========================================================= */
const LINES = {
  hello: "와! 안녕! 난 체리야! 내가 너를 도와 줄게!",
  good:  "우와! 진짜 잘한다! 내 체리가 하늘로 올라갈 것 같아!",
  wrong: "어.........어? 틀렸어?..... 다시 해 봐.....",
  stuck: "어, 친구야? 왜 가만히 있어? 나간 거야? 다시 들어와 줘!",
  done:  "와! 끝났어! 레벨이 올라갈 것 같지 않아?"
};

/* =========================================================
   그림 도구 (SVG)
   ========================================================= */
const INK = "#3a2a2a";
const OL = `stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const OL3 = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const g = (x, y, s, inner, extra) => `<g transform="translate(${x} ${y}) scale(${s || 1})" ${extra || ""}>${inner}</g>`;

function shelf(x, y, w, h){
  const colors = ["#e2384d", "#4f8ad9", "#f5b301", "#3a9a4a", "#9b6ad6", "#ff8a3d", "#2bb3a8"];
  const widths = [12, 9, 15, 11, 8, 14, 10, 13];
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#b97a45" ${OL}/>`;
  const rows = 3, rh = (h - 12) / rows;
  let k = 0;
  for(let r = 0; r < rows; r++){
    const ry = y + 6 + r * rh;
    out += `<rect x="${x + 6}" y="${ry}" width="${w - 12}" height="${rh - 6}" fill="#7a4a26"/>`;
    let bx = x + 9;
    while(bx < x + w - 22){
      const bw = widths[k % widths.length], bh = rh - 12 - (k % 3) * 4;
      out += `<rect x="${bx}" y="${ry + rh - 6 - bh}" width="${bw}" height="${bh}" fill="${colors[k % colors.length]}" stroke="${INK}" stroke-width="2"/>`;
      bx += bw + 2; k++;
    }
  }
  return out;
}
const bgLibrary = () => `<rect width="400" height="300" fill="#fdf0d5"/><rect y="236" width="400" height="64" fill="#e7c894"/>
  <line x1="0" y1="236" x2="400" y2="236" ${OL3}/>${shelf(18, 50, 150, 186)}${shelf(232, 50, 150, 186)}`;
const bgDoor = () => `<rect width="400" height="300" fill="#fdf0d5"/><rect y="236" width="400" height="64" fill="#e7c894"/>
  <line x1="0" y1="236" x2="400" y2="236" ${OL3}/>
  <rect x="40" y="70" width="110" height="166" fill="#fff6c9" ${OL}/>
  <path d="M40 70 L92 86 L92 250 L40 236 Z" fill="#c98b52" ${OL}/><circle cx="82" cy="160" r="5" fill="${INK}"/>
  <rect x="190" y="26" width="180" height="46" rx="10" fill="#fff" ${OL}/>
  <text x="280" y="58" font-size="26" text-anchor="middle" font-family="Jua,sans-serif" fill="${INK}">도서관</text>
  ${shelf(250, 90, 120, 146)}`;
const rainLines = () => {
  let s = `<g class="rain" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8">`;
  for(let i = 0; i < 18; i++){ const x = (i * 53) % 400 + 8, y = (i * 37) % 200 + 10; s += `<line x1="${x}" y1="${y}" x2="${x - 5}" y2="${y + 16}" style="animation-delay:-${(i % 7) / 10}s"/>`; }
  return s + `</g>`;
};
const bgRain = () => `<rect width="400" height="300" fill="#a9bdd2"/>
  ${cloud(80, 46, 1.2, "#e6ecf2")}${cloud(300, 36, 1, "#dfe6ee")}
  <rect x="250" y="120" width="70" height="120" fill="#c7d3df" ${OL3}/><path d="M244 122 L285 92 L326 122 Z" fill="#8fa3b8" ${OL3}/>
  <rect x="268" y="150" width="18" height="18" fill="#fff6c9" ${OL3}/><rect x="292" y="150" width="18" height="18" fill="#fff6c9" ${OL3}/>
  <rect y="240" width="400" height="60" fill="#8593a2"/><line x1="0" y1="240" x2="400" y2="240" ${OL3}/>${rainLines()}`;
const bgNight = () => {
  let st = "";
  [[40,40],[110,70],[170,30],[250,60],[330,30],[370,90],[60,110],[300,120]].forEach((p, i) =>
    st += `<path d="${starPath(p[0], p[1], 5)}" fill="#fff6a8" class="twinkle" style="animation-delay:-${i * .3}s"/>`);
  return `<rect width="400" height="300" fill="#22315f"/>${st}<path d="M0 250 Q100 220 200 245 T400 236 L400 300 L0 300 Z" fill="#2f5a3a" ${OL3}/>`;
};
function starPath(cx, cy, r){
  let d = "";
  for(let i = 0; i < 10; i++){
    const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * .45 : r;
    d += (i ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + " " + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + "Z";
}
function cloud(x, y, s, fill){
  return g(x, y, s, `<path d="M-40 10 Q-44 -8 -26 -12 Q-22 -30 0 -26 Q16 -36 30 -20 Q48 -18 44 4 Q46 16 30 16 L-30 16 Q-46 16 -40 10Z" fill="${fill || "#fff"}" ${OL3}/>`);
}
function cat(x, y, s, mood){
  const eyes = mood === "surprise"
    ? `<circle cx="27" cy="-30" r="5" fill="#fff" ${OL3}/><circle cx="43" cy="-30" r="5" fill="#fff" ${OL3}/><circle cx="27" cy="-30" r="2" fill="${INK}"/><circle cx="43" cy="-30" r="2" fill="${INK}"/>`
    : mood === "happy"
    ? `<path d="M22 -30 q5 -6 10 0 M38 -30 q5 -6 10 0" fill="none" ${OL3}/>`
    : `<circle cx="27" cy="-29" r="3.5" fill="${INK}"/><circle cx="43" cy="-29" r="3.5" fill="${INK}"/>`;
  const mouth = mood === "surprise" ? `<ellipse cx="35" cy="-17" rx="3" ry="4" fill="${INK}"/>` : `<path d="M30 -19 q5 5 10 0" fill="none" ${OL3}/>`;
  return g(x, y, s, `
    <path class="wag" d="M-34 -2 Q-62 -10 -56 -44 Q-54 -54 -46 -50 Q-50 -24 -30 -14" fill="#f4a340" ${OL}/>
    <ellipse cx="0" cy="0" rx="40" ry="24" fill="#f4a340" ${OL}/>
    <path d="M-14 -20 L-10 -2 M0 -23 L2 -4 M12 -21 L12 -6" stroke="#d07a1f" stroke-width="4" stroke-linecap="round"/>
    <path d="M-24 18 L-24 30 M-8 20 L-8 30 M14 20 L14 30 M28 16 L28 28" ${OL}/>
    <path d="M18 -42 L16 -62 L30 -50 Z M52 -42 L56 -62 L40 -50 Z" fill="#f4a340" ${OL}/>
    <circle cx="35" cy="-28" r="22" fill="#f4a340" ${OL}/>
    <ellipse cx="22" cy="-20" rx="4" ry="2.5" fill="#ff8fa0" opacity=".8"/><ellipse cx="48" cy="-20" rx="4" ry="2.5" fill="#ff8fa0" opacity=".8"/>
    ${eyes}<path d="M33 -23 L37 -23 L35 -20 Z" fill="#c2414f"/>${mouth}
    <path d="M14 -24 L2 -27 M14 -20 L2 -18 M56 -24 L68 -27 M56 -20 L68 -18" stroke="${INK}" stroke-width="2"/>`);
}
function kid(x, y, s, shirt, hair, opt){
  opt = opt || {};
  const face = opt.sad
    ? `<path d="M-8 -78 q3 3 6 0 M4 -78 q3 3 6 0" fill="none" ${OL3}/><path d="M-6 -64 q6 -5 12 0" fill="none" ${OL3}/>`
    : `<circle cx="-7" cy="-77" r="3" fill="${INK}"/><circle cx="7" cy="-77" r="3" fill="${INK}"/><path d="M-7 -66 q7 7 14 0" fill="none" ${OL3}/>`;
  const hood = opt.hood ? `<path d="M-26 -72 Q-26 -106 0 -106 Q26 -106 26 -72 L20 -72 Q20 -96 0 -96 Q-20 -96 -20 -72 Z" fill="${shirt}" ${OL3}/>` : "";
  const armR = opt.wave ? `<path d="M16 -40 L34 -66" ${OL}/><circle cx="35" cy="-69" r="6" fill="#ffd9c2" ${OL3}/>` : `<path d="M16 -40 L26 -16" ${OL}/>`;
  return g(x, y, s, `
    <path d="M-8 -12 L-10 0 M8 -12 L10 0" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
    <path d="M-20 -46 Q-22 -10 -20 -10 L20 -10 Q22 -10 20 -46 Q0 -54 -20 -46 Z" fill="${shirt}" ${OL}/>
    <path d="M-16 -40 L-26 -16" ${OL}/>${armR}
    <circle cx="0" cy="-74" r="22" fill="#ffd9c2" ${OL}/>
    <path d="M-22 -76 Q-24 -100 0 -98 Q24 -100 22 -76 Q12 -90 -2 -86 Q-14 -90 -22 -76 Z" fill="${hair}" ${OL3}/>
    ${hood}${face}
    <ellipse cx="-13" cy="-68" rx="4" ry="2.5" fill="#ff8fa0" opacity=".7"/><ellipse cx="13" cy="-68" rx="4" ry="2.5" fill="#ff8fa0" opacity=".7"/>
    ${opt.wet ? `<path d="M-30 -96 q-4 8 0 10 q4 -2 0 -10Z M30 -90 q-4 8 0 10 q4 -2 0 -10Z" fill="#7fc4ff" ${OL3}/>` : ""}`);
}
function adult(x, y, s){
  return g(x, y, s, `
    <path d="M-10 -14 L-12 0 M10 -14 L12 0" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
    <path d="M-24 -66 Q-28 -12 -24 -12 L24 -12 Q28 -12 24 -66 Q0 -76 -24 -66 Z" fill="#6aa8a0" ${OL}/>
    <path d="M24 -60 L44 -84" ${OL}/>
    <circle cx="0" cy="-96" r="22" fill="#ffd9c2" ${OL}/>
    <circle cx="0" cy="-124" r="10" fill="#4a3428" ${OL3}/>
    <path d="M-22 -98 Q-22 -120 0 -118 Q22 -120 22 -98 Q8 -110 -22 -98Z" fill="#4a3428" ${OL3}/>
    <circle cx="-8" cy="-96" r="6" fill="none" ${OL3}/><circle cx="8" cy="-96" r="6" fill="none" ${OL3}/><line x1="-2" y1="-96" x2="2" y2="-96" ${OL3}/>
    <path d="M-6 -84 q6 5 12 0" fill="none" ${OL3}/>`);
}
function umbrella(x, y, color, w){
  w = w || 100; const h = w * .5;
  return `<path d="M${x} ${y} L${x} ${y + h * 1.7} q0 12 -10 10" fill="none" ${OL}/>
    <path d="M${x - w / 2} ${y} Q${x} ${y - h * 1.3} ${x + w / 2} ${y} Q${x + w / 3} ${y - 10} ${x + w / 6} ${y} Q${x} ${y - 10} ${x - w / 6} ${y} Q${x - w / 3} ${y - 10} ${x - w / 2} ${y} Z" fill="${color}" ${OL}/>`;
}
const book = (x, y, color, rot) => `<g transform="translate(${x} ${y}) rotate(${rot || 0})"><rect x="-18" y="-24" width="36" height="48" rx="4" fill="${color}" ${OL}/><line x1="-10" y1="-24" x2="-10" y2="24" ${OL3}/></g>`;
const fish = (x, y, c) => `<ellipse cx="${x}" cy="${y}" rx="14" ry="8" fill="${c}" ${OL3}/><path d="M${x - 13} ${y} l-10 -7 l0 14 Z" fill="${c}" ${OL3}/><circle cx="${x + 6}" cy="${y - 2}" r="2" fill="${INK}"/>`;
function openBook(x, y){
  return `<path d="M${x} ${y} Q${x - 50} ${y - 16} ${x - 96} ${y - 4} L${x - 96} ${y + 64} Q${x - 50} ${y + 52} ${x} ${y + 68} Z" fill="#fff" ${OL}/>
    <path d="M${x} ${y} Q${x + 50} ${y - 16} ${x + 96} ${y - 4} L${x + 96} ${y + 64} Q${x + 50} ${y + 52} ${x} ${y + 68} Z" fill="#fff" ${OL}/>
    ${fish(x - 56, y + 18, "#7fc4ff")}${fish(x - 40, y + 44, "#ff8a3d")}${fish(x + 44, y + 22, "#f5b301")}${fish(x + 60, y + 46, "#9b6ad6")}`;
}
function squirrel(x, y, s, opt){
  opt = opt || {};
  const eye = opt.sleep ? `<path d="M10 -40 q5 4 10 0" fill="none" ${OL3}/>` : `<circle cx="15" cy="-41" r="3.5" fill="${INK}"/>`;
  const arm = opt.wave ? `<path d="M10 -14 L28 -40" ${OL}/><circle cx="29" cy="-43" r="5" fill="#c9844f" ${OL3}/>` : `<path d="M10 -14 L20 -4" ${OL}/>`;
  return g(x, y, s, `
    <path d="M-10 0 Q-52 -6 -46 -50 Q-42 -78 -18 -72 Q-36 -62 -30 -42 Q-26 -20 -6 -14 Z" fill="#a8622f" ${OL}/>
    <ellipse cx="0" cy="-10" rx="16" ry="20" fill="#c9844f" ${OL}/><ellipse cx="3" cy="-6" rx="8" ry="11" fill="#f3d2ad"/>
    ${arm}<circle cx="10" cy="-40" r="16" fill="#c9844f" ${OL}/>
    <path d="M0 -52 L2 -66 L12 -54 Z" fill="#c9844f" ${OL3}/>${eye}
    <circle cx="25" cy="-36" r="3" fill="${INK}"/><ellipse cx="14" cy="-32" rx="4" ry="2.5" fill="#ff8fa0" opacity=".7"/>`);
}
const tree = (x, y, h) => `<rect x="${x - 12}" y="${y - h}" width="24" height="${h}" fill="#7a4a26" ${OL}/>
  <circle cx="${x - 30}" cy="${y - h}" r="34" fill="#3a7a4a" ${OL}/><circle cx="${x + 30}" cy="${y - h + 4}" r="32" fill="#3a7a4a" ${OL}/><circle cx="${x}" cy="${y - h - 26}" r="36" fill="#47905a" ${OL}/>`;
function moon(x, y, r, face){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffe680" ${OL}/>` + (face
    ? `<path d="M${x - 14} ${y - 4} q5 -6 10 0 M${x + 4} ${y - 4} q5 -6 10 0" fill="none" ${OL3}/><path d="M${x - 10} ${y + 8} q10 10 20 0" fill="none" ${OL3}/><ellipse cx="${x - 18}" cy="${y + 6}" rx="5" ry="3" fill="#ffb3a0"/><ellipse cx="${x + 18}" cy="${y + 6}" rx="5" ry="3" fill="#ffb3a0"/>`
    : `<circle cx="${x - 8}" cy="${y - 6}" r="5" fill="#f2d35c"/><circle cx="${x + 9}" cy="${y + 8}" r="7" fill="#f2d35c"/>`);
}
const heart = (x, y, s) => g(x, y, s, `<path d="M0 8 C-14 -2 -12 -14 -4 -14 C0 -14 0 -10 0 -8 C0 -10 0 -14 4 -14 C12 -14 14 -2 0 8Z" fill="#ff5b7a" ${OL3}/>`, `class="float"`);
const qmark = (x, y) => `<text x="${x}" y="${y}" font-size="54" font-family="Jua,sans-serif" text-anchor="middle" fill="#fff" stroke="${INK}" stroke-width="3" class="float">?</text>`;
const zzz = (x, y) => `<text x="${x}" y="${y}" font-size="30" font-family="Jua,sans-serif" fill="#fff" stroke="${INK}" stroke-width="1.5" class="float">Z z z</text>`;
const thought = (x, y, inner) => `<circle cx="${x - 40}" cy="${y + 50}" r="5" fill="#fff" ${OL3}/><circle cx="${x - 26}" cy="${y + 36}" r="8" fill="#fff" ${OL3}/>
  <ellipse cx="${x + 10}" cy="${y}" rx="52" ry="38" fill="#fff" ${OL}/>${inner}`;
const scene = inner => `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">${inner}</svg>`;

/* =========================================================
   이야기 — 1학년이 읽을 수 있게 새로 지은 짧은 글
   ========================================================= */
const STORIES = [
  { id:"cat", emo:"🐱", title:"도서관에 온 고양이",

function patternShapes(pat){
  let s = "";
  if(pat === "dots"){
    for(let y = 138, r = 0; y < 222; y += 13, r++) for(let x = 56 + (r % 2) * 6; x < 146; x += 13) s += `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" opacity=".8"/>`;

    for(let y = 142; y < 222; y += 16) s += `<rect x="50" y="${y}" width="100" height="6" fill="#fff" opacity=".75"/>`;
  }else if(pat === "stars"){
    [[88,148],[114,180],[80,198],[124,208],[100,214],[110,144]].forEach(p => s += `<path d="${starPath(p[0], p[1], 6.5)}" fill="#fff6a8" stroke="${INK}" stroke-width="1.5"/>`);

    [[88,150],[114,182],[80,200],[124,208],[100,214],[112,146]].forEach(p => s += `<path transform="translate(${p[0]} ${p[1]}) scale(.5)" d="${HEART}" fill="#ff5b7a" stroke="#fff" stroke-width="3"/>`);
  }
  return s;
}
function dressSVG(color, pat){
  const id = "dc" + (++UID);

    ["#ff7b8a", "#ffb35c", "#ffe27a", "#9be3a0", "#8fd3ff", "#c7a2ff"].forEach((c, i) => bands += `<rect x="50" y="${128 + i * 16}" width="100" height="16" fill="${c}"/>`);

}

/* =========================================================
   소리 — 파일 없이 직접 만든 효과음
   ========================================================= */
let AC = null;
function audio(){
  if(!S.sound) return null;
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(f, dur, type, vol, delay, slide){
  const a = audio(); if(!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol || .14, t + .015);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function swish(){
  const a = audio(); if(!a) return;
  const len = a.sampleRate * .32, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.setValueAtTime(900, a.currentTime); f.frequency.exponentialRampToValueAtTime(3200, a.currentTime + .3);
  gn.gain.value = .22; src.connect(f).connect(gn).connect(a.destination); src.start();
}
const SFX = {
  tap:   () => tone(620, .07, "triangle", .1),
  pop:   () => { tone(520, .08, "sine", .14); tone(880, .1, "sine", .1, .05); },
  flip:  () => swish(),
  right: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "triangle", .13, i * .08)),
  wrong: () => { tone(330, .22, "square", .05, 0, 220); tone(250, .3, "square", .05, .18, 160); },
  star:  i => tone(700 + i * 180, .16, "triangle", .13),
  done:  () => [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, .2, "triangle", .12, i * .11)),
  level: () => { [523, 523, 523, 698].forEach((f, i) => tone(f, i === 3 ? .5 : .14, "square", .07, [0, .15, .3, .48][i])); [880, 1047].forEach((f, i) => tone(f, .4, "triangle", .1, .9 + i * .18)); }
};

const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let koVoice = null;
function pickVoice(){
  if(!TTS) return;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /^ko/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v => /^ko/i.test(v.lang)) || null;
}
if(TTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let readingBtn = null;
function speak(text, btn){
  if(!TTS) return;
  if(readingBtn === btn && speechSynthesis.speaking){ stopSpeak(); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g, "").replace(/\n/g, " "));
  u.lang = "ko-KR"; if(koVoice) u.voice = koVoice; u.rate = .88; u.pitch = 1.1;
  u.onend = u.onerror = () => { if(btn){ btn.classList.remove("on"); btn.textContent = "🔊 읽어 주기"; } readingBtn = null; };
  if(btn){ btn.classList.add("on"); btn.textContent = "⏹ 그만 읽기"; readingBtn = btn; }
  speechSynthesis.speak(u);
}
function stopSpeak(){
  if(!TTS) return;
  speechSynthesis.cancel();
  if(readingBtn){ readingBtn.classList.remove("on"); readingBtn.textContent = "🔊 읽어 주기"; readingBtn = null; }
}
const readBtnHTML = id => TTS ? `<button class="read-btn press" type="button" id="${id}">🔊 읽어 주기</button>` : "";

function typeInto(el, text){
  if(!el) return;
  clearInterval(el._t);
  const chars = Array.from(text); let i = 0;
  el.textContent = "";
  el._t = setInterval(() => { el.textContent = chars.slice(0, ++i).join(""); if(i >= chars.length) clearInterval(el._t); }, 32);
}

function confetti(n){
  const colors = ["#e2384d", "#ff9fb2", "#ffc83a", "#3a9a4a", "#8fd3ff", "#c7a2ff"];
  for(let i = 0; i < (n || 40); i++){
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = i % 3 ? "2px" : "50%";
    c.style.animationDelay = (Math.random() * .7) + "s";
    c.style.animationDuration = (2 + Math.random()) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}
function sparks(el, icons){
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  icons = icons || ["⭐", "✨", "🍒"];
  for(let i = 0; i < 10; i++){
    const s = document.createElement("span");
    s.className = "spark"; s.textContent = icons[i % icons.length];
    const a = Math.PI * 2 * i / 10, d = 70 + Math.random() * 40;
    s.style.left = cx - 13 + "px"; s.style.top = cy - 13 + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 800);
  }
}
function plusOne(el, text){
  const r = el.getBoundingClientRect();
  const p = document.createElement("span");
  p.className = "plus"; p.textContent = text;
  p.style.left = Math.min(innerWidth - 160, Math.max(10, r.left + r.width / 2 - 70)) + "px"; p.style.top = Math.max(60, r.top - 10) + "px";
  document.body.appendChild(p); setTimeout(() => p.remove(), 1300);
}
function countUp(el, to, ms){
  const start = performance.now();
  (function step(now){
    const k = Math.min(1, (now - start) / ms);
    el.textContent = Math.round(to * k);
    if(k < 1) requestAnimationFrame(step);
  })(start);
}
function levelInfo(){
  const lv = levelOf(S.xp);

}

function pageData(){

  if(R.page === n) return {art: st.askArt, text: st.ask, kind: "ask"};

  setTimeout(() => { sheet.remove(); turning = false; }, 640);
}
$("pgPrev").onclick = () => { if(R && R.page > 0) turnPage(-1, () => { R.page--; renderPage(); }); };
$("pgNext").onclick = () => { if(R && R.page < R.st.pages.length) turnPage(1, () => { R.page++; renderPage(); }); };
function choose(k){
  const st = R.st;
  SFX.pop();
  turnPage(1, () => {
    R.choice = k; R.page = st.pages.length + 1;
    const seen = S.seen[st.id] || (S.seen[st.id] = []);
    if(!seen.includes(k)) seen.push(k);
    if(!R.counted){ R.counted = true; S.xp += 1; }
    save(); renderPage();
    plusOne($("sideCherry"), "+1 경험치");
    say("이야기 끝! 이제 문제를 풀어 볼까?", "happy", "jump");
  });
}
$("storyHome").onclick = goHome;

/* =========================================================
   3. 문제
   ========================================================= */
let Q = null; // {i, solved}
function startQuiz(){
  Q = {i: 0, solved: false};
  show("sQuiz"); renderQuiz();
  say("문제야! 잘 생각해 봐.", "think", "jump");
}
function renderQuiz(){
  const st = R.st, item = st.quiz[Q.i];
  $("quizPanel").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h2>${st.emo} ${st.title}</h2><span class="pg-no">문제 ${Q.i + 1} / ${st.quiz.length}</span></div>
    <div class="quiz-q">${item.q}</div>
    <div style="text-align:center;margin-bottom:14px">${readBtnHTML("readQ")}</div>
    <div class="opts">${item.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o}</button>`).join("")}</div>
    <div class="book-nav" style="margin-top:auto;padding-top:18px">
      <button class="ghost" type="button" id="quizHome">게임판으로</button>
      <button class="go" type="button" id="quizNext" hidden>${Q.i + 1 < st.quiz.length ? "다음 문제 ▶" : "끝내기 ▶"}</button></div>`;
  $("quizHome").onclick = goHome;
  if($("readQ")) $("readQ").onclick = e => speak(item.q + " " + item.opts.map(o => o.replace(/^\S+\s/, "")).join(", "), e.currentTarget);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k, b));
  $("quizNext").onclick = () => {
    SFX.pop();
    if(Q.i + 1 < st.quiz.length){ Q.i++; Q.solved = false; renderQuiz(); say("다음 문제야!", "think", "jump"); }
    else finishStory();
  };
}
function answer(k, btn){
  if(Q.solved) return;
  stopSpeak();
  if(k === R.st.quiz[Q.i].a){
    Q.solved = true;
    btn.classList.add("right");
    document.querySelectorAll(".opt").forEach(b => { if(b !== btn) b.disabled = true; });
    SFX.right(); sparks(btn);
    S.xp += 1; save();
    plusOne(btn, "+1 경험치");
    say("good", "happy", "jump", 3200);
    $("quizNext").hidden = false;
  }else{
    btn.classList.add("wrong"); btn.disabled = true;
    R.wrongs++;
    SFX.wrong();
    say("wrong", "sad", "tilt", 3200);
  }
}

/* =========================================================
   4. 결과 (별 1~3개)
   ========================================================= */
function finishStory(){
  const st = R.st;
  const stars = R.wrongs === 0 ? 3 : R.wrongs === 1 ? 2 : 1;
  const isBest = stars > (S.best[st.id] || 0);
  if(isBest){ S.best[st.id] = stars; save(); }
  const gained = S.xp - R.xpStart;
  const L = levelInfo();
  show("sResult");
  $("resMain").innerHTML = `<h2>🎉 다 읽었어요!</h2>
    <div class="big-stars" id="bigStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="round" style="font-size:20px;color:var(--sub)">${stars === 3 ? "한 번도 안 틀렸어요!" : stars === 2 ? "한 번만 틀렸어요!" : "끝까지 해냈어요!"}${isBest ? " · 최고 기록!" : ""}</div>
    <div class="xp-line">경험치 <b>+<span id="xpRoll">0</span></b></div>
    <div style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="lv-name"><span class="lv-badge">레벨 ${L.lv}</span>${LEVEL_NAMES[L.lv]}</div>
      <div class="lv-bar" style="width:min(420px,90%)"><div class="lv-fill" id="resFill"></div></div>
      <div class="lv-sub">${L.sub}</div>
    </div>
    <div class="bubble up" id="resBubble"></div>
    <div class="btn-row">
      <button class="go" type="button" id="resHome">게임판으로</button>
      <button class="ghost" type="button" id="resAgain">🔁 다시 하기</button>
      <button class="ghost" type="button" id="resCloset">👗 옷장</button>
    </div>`;
  drawMascot("happy");
  $("resHome").onclick = goHome;
  $("resAgain").onclick = () => { SFX.pop(); startStory(STORIES.indexOf(st)); };
  $("resCloset").onclick = () => { SFX.pop(); openCloset(); };
  SFX.done(); confetti(30);
  say("done", "happy", "spin", 4000);
  const spans = document.querySelectorAll("#bigStars span");
  for(let i = 0; i < stars; i++) setTimeout(() => { spans[i].classList.add("lit"); SFX.star(i); }, 500 + i * 380);
  setTimeout(() => { countUp($("xpRoll"), gained, 700); $("resFill").style.width = L.pct + "%"; }, 600 + stars * 380);
  setTimeout(checkLevelUp, 1700 + stars * 380);
}

/* =========================================================
   레벨 업 연출
   ========================================================= */
function checkLevelUp(){
  if(!R || R.lvShown) return;
  const now = levelOf(S.xp);
  if(now <= R.lvStart) return;
  R.lvShown = true;
  const from = R.lvStart;
  const opened = S.rebirth > 0 ? [] : Object.entries(CLOSET).flatMap(([gk, gr]) => gr.list.filter(it => !it.rb && it.lv > from && it.lv <= now && it.id !== "none").map(it => itemIcon(gk, it)));
  $("luNum").textContent = from;
  $("luName").textContent = LEVEL_NAMES[now];
  $("luCherry").innerHTML = cherrySVG("happy");
  $("luOpened").innerHTML = opened.length
    ? `<div class="round" style="font-size:21px;margin-bottom:8px">새 옷이 열렸어요!</div><div class="lu-items">${opened.map((s, i) => `<span style="animation-delay:${.9 + i * .15}s">${s}</span>`).join("")}</div>` : "";
  $("levelUp").classList.add("on");
  SFX.level(); confetti(60);
  const pic = $("luCherry");
  setTimeout(() => { $("luNum").classList.remove("roll"); void $("luNum").offsetWidth; $("luNum").classList.add("roll"); setTimeout(() => $("luNum").textContent = now, 250); }, 600);
  pic.classList.remove("jump"); void pic.offsetWidth; pic.classList.add("jump");
  setTimeout(() => { pic.classList.remove("jump"); void pic.offsetWidth; pic.classList.add("jump"); }, 900);
}
function closeLevelUp(){ $("levelUp").classList.remove("on"); }
$("luClose").onclick = () => { SFX.tap(); closeLevelUp(); };
$("luCloset").onclick = () => { SFX.pop(); closeLevelUp(); openCloset(); };

function goHome(){
  SFX.tap();
  show("sHome"); renderHome();
  say("hello", "happy", "jump");
  checkLevelUp();
}

/* =========================================================
   5. 옷장 — 누르면 체리에게 바로 입혀요
   ========================================================= */
function openCloset(){ show("sCloset"); renderCloset(); say("옷을 골라 줘! 바로 입어 볼게!", "happy", "jump"); }
const needText = it => it.rb ? `🌟 환생 ${it.rb}번` : `🔒 레벨 ${it.lv}`;
function renderCloset(){
  $("closetRebirth").innerHTML = levelOf(S.xp) >= MAX_LEVEL ? `<button class="go rebirth-btn" type="button" id="closetRebirthBtn">🌟 환생하기</button>` : "";
  if($("closetRebirthBtn")) $("closetRebirthBtn").onclick = openRebirth;
  $("racks").innerHTML = Object.entries(CLOSET).map(([key, gr]) => `<div class="rack"><h3>${gr.name}</h3><div class="items">
    ${gr.list.map(it => {
      const locked = !isUnlocked(it), on = S.outfit[key] === it.id;
      return `<button class="item press${on ? " on" : ""}${locked ? " lock" : ""}${it.rb ? " special" : ""}" type="button" data-g="${key}" data-id="${it.id}" aria-label="${it.label}${locked ? " (잠김)" : ""}">
        ${itemIcon(key, it)}${locked ? needText(it) : it.label}</button>`;
    }).join("")}</div></div>`).join("");
  document.querySelectorAll(".item").forEach(b => b.onclick = () => wear(b));
}
function wear(b){
  const it = CLOSET[b.dataset.g].list.find(x => x.id === b.dataset.id);
  if(!isUnlocked(it)){
    SFX.wrong(); b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope");
    say(it.rb ? `환생을 ${it.rb}번 하면 입을 수 있어!` : `레벨 ${it.lv}이 되면 입을 수 있어!`, "sad", "tilt");
    return;
  }
  S.outfit[b.dataset.g] = b.dataset.id; save();
  renderCloset();
  SFX.pop();
  const pic = $("closetCherry");
  sparks(pic, ["✨", "⭐", "💖"]);
  say(["잘 어울려?", "우와, 예쁘다!", "이거 마음에 들어!"][Math.floor(Math.random() * 3)], "happy", "jump");
}
$("closetBack").onclick = goHome;

/* =========================================================
   막혔을 때 — 20초 동안 아무것도 안 누르거나, 다른 창에 갔다 오면
   ========================================================= */
let idleT;
function resetIdle(){
  clearTimeout(idleT);
  idleT = setTimeout(() => {
    if(document.querySelector(".modal.on")) return;
    if(TTS && speechSynthesis.speaking){ resetIdle(); return; }
    say("stuck", "think", "tilt", 4000);
  }, 20000);
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, resetIdle));
let wasHidden = false;
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ wasHidden = true; stopSpeak(); return; }
  if(wasHidden){ wasHidden = false; say("stuck", "think", "tilt", 4000); resetIdle(); }
});

/* =========================================================
   🔊 소리 켜기/끄기
   ========================================================= */
function renderSoundBtn(){ $("soundBtn").textContent = S.sound ? "🔊" : "🔈"; $("soundBtn").setAttribute("aria-label", S.sound ? "소리 끄기" : "소리 켜기"); }
$("soundBtn").onclick = () => { S.sound = !S.sound; save(); renderSoundBtn(); if(S.sound) SFX.pop(); else stopSpeak(); };

/* =========================================================
   🧾 만든 기록
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const num = (v, unit) => v === null || v === undefined ? "계산 중" : Number(v).toLocaleString("ko-KR") + unit;
async function openReceipt(){
  SFX.tap();
  $("receipt").classList.add("on"); $("rcBody").textContent = "불러오는 중…";
  try{
    const r = await fetch("receipt.json", {cache: "no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    $("rcBody").innerHTML = `<p class="round" style="font-size:22px;margin:0 0 10px">${esc(d.title || "")}</p>
      <div class="rc-nums">
        <span>AI가 일한 시간</span><b>${num(d.minutes, "분")}</b>
        <span>주고받은 글자 조각(토큰)</span><b>${num(d.tokens, "개")}</b>
        <span>돈으로 치면</span><b>${d.won === null || d.won === undefined ? "계산 중" : "약 " + num(d.won, "원")}</b>
        <span>고친 횟수</span><b>${num(d.revisions, "번")}</b>
      </div>
      ${d.priceNote ? `<p class="rc-note">${esc(d.priceNote)}</p>` : ""}
      <h3>🙋 AI 혼자서는 못 해서 사람이 정한 것</h3>
      <ul>${(d.aiCouldNot || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <h3>💰 더 만들고 싶지만 돈·준비가 더 드는 것</h3>
      <ul>${(d.costsMore || []).map(c => `<li><b>${esc(c.feature)}</b> — ${esc(c.why)}</li>`).join("")}</ul>`;
  }catch(e){
    $("rcBody").innerHTML = `<p style="font-size:18px">기록을 불러오지 못했어요. 인터넷 주소로 열었는지 확인해 주세요.</p>`;
  }
}
$("receiptBtn").onclick = openReceipt;
$("rcClose").onclick = () => $("receipt").classList.remove("on");
$("receipt").onclick = e => { if(e.target.id === "receipt") $("receipt").classList.remove("on"); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ $("receipt").classList.remove("on"); closeLevelUp(); } });

/* =========================================================
   시작
   ========================================================= */
renderSoundBtn();
renderTitle();
say("hello", "happy", "jump");
resetIdle();
</script>
</body>
</html>
