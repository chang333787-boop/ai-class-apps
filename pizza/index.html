<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>맛있는 피자 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#fff6e8; --card:#ffffff; --line:#ecdcc4; --ink:#2b2b2b; --soft:#7a6a55;
  --red:#e2483d; --red2:#b3342b; --orange:#f39c32; --yellow:#ffd25e; --green:#3aa65b; --green2:#2b7c44; --blue:#3b82c4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Jua",system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(#f3e3c9 1.5px,transparent 1.5px);background-size:22px 22px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .08s}
button:not(:disabled):active{transform:scale(.94)}
.corner{position:fixed;top:10px;z-index:30;padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);
  color:var(--ink);text-decoration:none;font-size:17px;box-shadow:0 2px 0 var(--line)}
.corner.home{left:10px}
.cornerR{position:fixed;top:10px;right:10px;z-index:30;display:flex;gap:8px}
.cornerR .corner{position:static}
.screen{display:none;min-height:100vh;padding:60px 12px 14px}
.screen.on{display:block;animation:screenIn .35s ease-out}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 마스코트 ---------- */
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.mascot .body{animation:float 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes float{50%{transform:translateY(-4px)}}
.m-eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.m-open,.m-sad,.m-sweat,.m-browsad{display:none}
.mood-cheer .m-smile{display:none}.mood-cheer .m-open{display:inline}
.mood-sad .m-smile{display:none}.mood-sad .m-sad,.mood-sad .m-sweat,.mood-sad .m-browsad{display:inline}
.m-hand{transform-box:fill-box;transform-origin:50% 0}
.mood-cheer .m-hand{animation:wave .32s ease-in-out 4 alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.bubble{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 16px;font-size:22px;
  font-weight:700;position:relative;min-height:1.6em}

/* ---------- 시작 화면 ---------- */
#start{text-align:center}
#start h1{font-size:clamp(32px,6vw,52px);margin:4px 0 0;color:var(--red);text-shadow:0 3px 0 #fff,0 5px 0 #f3d2a6}
#start h1 span{display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#start .sub{font-size:19px;color:var(--soft);margin:4px 0 2px}
.startRow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0}
#startMascot{width:min(210px,46vw)}
.best{font-size:18px;color:var(--soft);margin:2px 0 8px;min-height:1.3em}
.nameRow{font-size:24px;margin:6px 0 14px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.nameRow input{font:inherit;font-size:24px;width:8.5em;padding:8px 10px;border:3px solid var(--line);border-radius:12px;text-align:center;
  -webkit-user-select:text;user-select:text;background:#fff}
.btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{font-size:24px;font-weight:800;padding:14px 26px;border-radius:16px;border:0;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red2)}
.big:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--red2)}
.big.alt{background:var(--blue);box-shadow:0 5px 0 #2a6197}
.small{font-size:16px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;margin-top:14px}

/* ---------- 게임 화면 ---------- */
#game{padding-top:56px}
.g-top{display:grid;grid-template-columns:1.15fr .85fr 1.2fr 1.5fr;gap:10px;max-width:1180px;margin:0 auto;align-items:stretch}
.box{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 10px;position:relative;box-shadow:0 3px 0 var(--line)}
.label{font-size:15px;font-weight:800;color:var(--soft)}
#ticket{background:#fffdf6;background-image:repeating-linear-gradient(#fffdf6 0 27px,#f0e6d2 27px 28px)}
#ticketItems{font-size:19px;line-height:1.45;margin-top:2px;min-height:2.6em}
#ticketItems .ti{display:inline-flex;align-items:center;gap:2px;margin-right:6px;white-space:nowrap}
#ticketItems .ti .icon{width:24px;height:24px}
#ticketItems .ti.done{color:var(--green)}
#ticketItems .ti.done::after{content:"✔";font-size:15px}
#oven{display:flex;flex-direction:column;align-items:center;gap:4px}
#oven svg{width:100%;max-width:150px;height:52px}
.flame{opacity:0;transition:opacity .3s}
.hot .flame{opacity:1;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:translateY(-2px) scaleY(1.1)}}
.flame{transform-box:fill-box;transform-origin:bottom center}
.ovenWin{fill:#2e2e2e;transition:fill .3s}
.hot .ovenWin{fill:#5a2414}
#ovenBtn{font-size:17px;font-weight:800;padding:6px 8px;border-radius:12px;border:0;background:var(--orange);color:#fff;width:100%;box-shadow:0 3px 0 #c0751c}
#ovenBtn:disabled,#serveBtn:disabled{background:#d6cfc4;color:#fff;box-shadow:none}
.sign{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0;overflow:hidden;
  background:#fff3d6;border-color:var(--orange)}
.awning{width:100%;height:26px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff 22px 44px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:radial-gradient(circle at 11px 0,var(--red) 10px,transparent 10.5px) 0 0/44px 10px,radial-gradient(circle at 33px 0,#fff 10px,transparent 10.5px) 0 0/44px 10px}
#sign{font-size:clamp(19px,2.3vw,27px);font-weight:900;padding:16px 8px 8px;flex:1;display:flex;align-items:center;justify-content:center;line-height:1.15}
#board{padding:6px 8px}
.timeRow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.timer{font-size:clamp(26px,3vw,34px);font-weight:900;font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.lbTitle{font-size:14px;font-weight:800;color:var(--soft)}
.lb{position:relative;height:104px;margin-top:2px}
.lbr{position:absolute;left:0;right:0;height:24px;display:flex;align-items:center;gap:5px;font-size:15px;transition:top .5s cubic-bezier(.3,1.3,.5,1);
  border-radius:8px;padding:0 4px}
.lbr.me{background:#ffe9e4;font-weight:900}
.lbr .rk{width:1.5em;text-align:center;font-size:16px}
.lbr .nm{width:6.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr .bar{flex:1;height:10px;background:#f1eadf;border-radius:6px;overflow:hidden}
.lbr .bar i{display:block;height:100%;width:0;border-radius:6px}
.lbr .pt{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

.g-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;max-width:1180px;margin:10px auto 0;align-items:center}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center}
.ing{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 2px;font-size:17px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-height:80px;justify-content:center;box-shadow:0 3px 0 var(--line)}
.ing .icon{width:40px;height:40px;transition:transform .15s}
.ing:not(:disabled):hover .icon{transform:scale(1.1) rotate(-6deg)}
.ing.on{border-color:var(--green);background:#eaf7ee;box-shadow:0 3px 0 #b9e2c5}
.ing:disabled{opacity:.45}
#pizzaWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pizzaBox{position:relative;width:min(330px,42vh,86vw);aspect-ratio:1}
#pizza{width:100%;height:100%;display:block;overflow:visible}
.crust{fill:#f2d19a;stroke:#c98d47;transition:fill 3s,stroke 3s}
.chz{fill:#fff0a8;stroke:#f2c94a;transition:fill 3s}
.cspot{opacity:0;transition:opacity 3s}
.tops{transition:filter 3s}
#pizza.cook .crust{fill:#d58c3c;stroke:#9a5a1c}
#pizza.cook .chz{fill:#ffcb45}
#pizza.cook .cspot{opacity:1}
#pizza.cook .tops{filter:brightness(.88) saturate(1.25)}
#pizza.notrans *{transition:none!important}
.drop{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:translateY(-70px) scale(1.7);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
#pizza.baking{animation:shimmer .22s infinite alternate}
@keyframes shimmer{to{transform:scale(1.008) translateY(-1px)}}
.hint{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;color:#fff;font-weight:800;text-shadow:0 2px 0 #b5321d;pointer-events:none}
.steam{position:absolute;left:0;right:0;top:-6%;height:40%;pointer-events:none;display:none}
.steam.on{display:block}
.steam span{position:absolute;bottom:0;width:26px;height:80px;opacity:0;animation:steam 2.4s ease-in infinite}
.steam span svg{width:100%;height:100%;filter:drop-shadow(0 0 2px rgba(140,90,40,.55))}
.steam span:nth-child(1){left:32%}.steam span:nth-child(2){left:47%;animation-delay:.8s}.steam span:nth-child(3){left:62%;animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(20px) scaleX(.8)}30%{opacity:.85}100%{opacity:0;transform:translateY(-50px) scaleX(1.3)}}
.pizzaBtns{display:flex;gap:8px}
#resetBtn{font-size:16px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}

.g-bot{display:grid;grid-template-columns:.9fr 1.8fr 1.3fr;gap:10px;max-width:1180px;margin:10px auto 0;align-items:stretch}
#serveBtn{font-size:24px;font-weight:900;border:0;border-radius:16px;background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green2);min-height:84px}
#serveBtn:not(:disabled){animation:ready 1s infinite}
@keyframes ready{50%{filter:brightness(1.12)}}
#counter{display:flex;align-items:center;gap:8px;overflow:hidden;min-height:96px}
#cur{width:78px;flex:none}
#cur svg{display:block;width:100%}
#cur.walkin{animation:walkin .6s ease-out}
@keyframes walkin{from{transform:translateX(160px)}60%{transform:translateX(-6px)}to{transform:none}}
#cur.byeHappy{animation:bye .6s ease-in forwards}
#cur.byeSad{animation:byeSad .6s ease-in forwards}
@keyframes bye{to{transform:translateX(-140px) translateY(-8px);opacity:0}}
@keyframes byeSad{20%{transform:translateX(6px)}to{transform:translateX(-140px);opacity:0}}
.gInfo{flex:1;min-width:0}
.gBubble{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;font-size:16px;font-weight:700;display:inline-block;max-width:100%}
.gBubble.picky{border-color:var(--red);color:var(--red)}
.mood{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:14px;font-weight:800;color:var(--soft)}
#moodFace{font-size:22px}
.mbar{flex:1;height:13px;border-radius:8px;background:#f1eadf;overflow:hidden}
.mbar i{display:block;height:100%;width:100%;background:var(--green)}
.queue{display:flex;gap:2px;align-items:flex-end;flex:none}
.queue .qg{width:42px;opacity:.75}
.queue .qg svg{display:block;width:100%}
#helper{display:flex;align-items:center;gap:6px;padding-bottom:28px}
#helperMascot{width:78px;flex:none}
#helperSay{font-size:17px;padding:6px 10px;opacity:0;transition:opacity .2s;flex:1}
#helperSay.show{opacity:1}
#helpBtn{position:absolute;right:6px;bottom:4px;font-size:14px;padding:3px 8px;border-radius:10px;border:2px solid var(--line);background:#fff}

.glow{outline:5px solid var(--yellow);outline-offset:2px;animation:blink2 .7s infinite alternate;position:relative;z-index:2}
@keyframes blink2{to{outline-color:#ffb800}}
.pop{position:fixed;transform:translate(-50%,-50%);font-size:40px;font-weight:900;z-index:40;pointer-events:none;
  text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff;animation:popup 1s forwards}
@keyframes popup{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}to{opacity:0;transform:translate(-50%,-120%)}}
.spark{position:fixed;z-index:39;pointer-events:none;font-size:22px;animation:spark .8s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(180deg);opacity:0}}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:41;pointer-events:none;font-size:clamp(34px,7vw,60px);font-weight:900;
  color:#fff;background:var(--red);padding:8px 26px;border-radius:18px;border:4px solid #fff;box-shadow:0 6px 0 var(--red2);animation:banner 1.4s forwards}
.banner.blue{background:var(--blue);box-shadow:0 6px 0 #2a6197}
@keyframes banner{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(2deg)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}to{opacity:0;transform:translate(-50%,-80%)}}

/* ---------- 창(모달) ---------- */
.modal{position:fixed;inset:0;background:rgba(40,25,10,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:20px;padding:20px 22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;font-size:19px;animation:sheetIn .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes sheetIn{from{transform:scale(.8);opacity:0}}
.sheet h2{margin:0 0 10px;font-size:26px}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{font-size:22px;padding:12px;border-radius:14px;border:3px solid var(--line);background:#fffaf2;font-weight:700}
.closeBtn{margin-top:14px;font-size:20px;padding:10px 20px;border-radius:14px;border:0;background:var(--ink);color:#fff}
.rc .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 6px}
.rc .num{background:#fff8ee;border:2px solid var(--line);border-radius:12px;padding:8px}
.rc .num b{display:block;font-size:22px}
.rc .note{font-size:14px;color:var(--soft)}
.rc h3{font-size:19px;margin:12px 0 4px}
.rc ul{margin:0;padding-left:1.2em;line-height:1.5}

/* ---------- 결과(영수증) ---------- */
#result{text-align:center}
.resultTop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#resultMascot{width:120px}
.paperWrap{filter:drop-shadow(0 4px 6px rgba(80,50,20,.25));max-width:430px;margin:14px auto 10px}
.paper{background:#fff;padding:18px 22px 20px;position:relative;text-align:left;font-size:19px}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:12px}
.paper::before{top:-11px;background:radial-gradient(circle at 10px 0,transparent 7px,#fff 7.5px) 0 0/20px 12px repeat-x}
.paper::after{bottom:-11px;background:radial-gradient(circle at 10px 12px,transparent 7px,#fff 7.5px) 0 0/20px 12px repeat-x}
.paper h2{text-align:center;margin:0;font-size:24px}
.paper .shop{text-align:center;font-size:22px;font-weight:900;margin:2px 0}
.paper .date{text-align:center;font-size:15px;color:var(--soft)}
.paper .dash{border-top:2px dashed #cdbfa8;margin:10px 0}
.paper .ln{display:flex;justify-content:space-between;padding:2px 0}
.paper .ln.total{font-size:24px;font-weight:900}
.paper .rankList{font-size:16px;color:#555}
.paper .rankList .me{color:var(--red);font-weight:900}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}
.stars svg{width:62px;height:62px;opacity:.18;transform:scale(.7)}
.stars svg.on{animation:starIn .55s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes starIn{from{opacity:.2;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.starText{text-align:center;font-size:16px;color:var(--soft)}
.stamp{position:absolute;right:14px;top:58px;border:4px solid var(--red);color:var(--red);font-size:24px;font-weight:900;padding:2px 10px;border-radius:10px;
  transform:rotate(-14deg);opacity:0}
.stamp.on{animation:stamp .4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.4)}to{opacity:.9;transform:rotate(-14deg) scale(1)}}
.records{max-width:430px;margin:6px auto;font-size:16px;color:var(--soft)}
.records ol{text-align:left;margin:4px auto;display:inline-block}

@media (max-width:900px){
  .g-top{grid-template-columns:1fr 1fr}
  .g-mid{grid-template-columns:1fr 1fr}
  #pizzaWrap{grid-column:1 / -1;order:-1}
  .g-bot{grid-template-columns:1fr 1fr}
  #counter{grid-column:1 / -1;order:-1}
}
@media (max-width:560px){
  .screen{padding-left:8px;padding-right:8px}
  .corner{font-size:15px;padding:7px 10px}
  .g-top{gap:8px}
  .g-mid{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(3,1fr);gap:6px}
  .ing{min-height:70px;font-size:15px}
  .ing .icon{width:34px;height:34px}
  .pizzaBox{width:min(250px,64vw)}
  .lbr .nm{width:4.8em}
  .lbr{font-size:14px}
  .g-bot{grid-template-columns:1fr}
  #counter{grid-column:auto}
  .queue .qg{width:34px}
  .paper{font-size:17px;padding:16px 16px 18px}
}
</style>
</head>
<body>

<a class="corner home" href="../">← 처음으로</a>
<div class="cornerR">
  <button class="corner" id="muteBtn" type="button" aria-label="소리 켜기/끄기">🔈</button>
  <button class="corner" id="receiptBtn" type="button">🧾 만든 기록</button>
</div>

<!-- 시작 화면 -->
<section class="screen on" id="start">
  <h1><span>🍕</span> 맛있는 피자 만들기</h1>
  <p class="sub">손님 주문대로 피자를 만들고, 옆 가게보다 점수를 많이 모아요!</p>
  <div class="startRow">
    <div class="mascot mood-cheer" id="startMascot"></div>
    <div class="bubble" id="startSay"></div>
  </div>
  <div class="best" id="bestLine"></div>
  <div class="nameRow">
    <input id="shopName" maxlength="8" placeholder="가게 이름" aria-label="가게 이름"><span>의 피자가게</span>
  </div>
  <div class="btnRow">
    <button class="big" id="openBtn" type="button">🔥 가게 열기 (10분)</button>
    <button class="big alt" id="tutBtn" type="button">📖 튜토리얼</button>
  </div>
  <button class="small" id="shortBtn" type="button">⏱️ 3분 연습</button>
</section>

<!-- 게임 화면 -->
<section class="screen" id="game">
  <div class="g-top">
    <div class="box" id="ticket"><div class="label">📋 주문 내역</div><div id="ticketItems"></div></div>
    <div class="box" id="oven">
      <div class="label">오븐</div>
      <svg viewBox="0 0 150 52" id="ovenSvg" aria-hidden="true">
        <rect x="3" y="3" width="144" height="46" rx="9" fill="#5b5f66" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="12" y="10" width="96" height="32" rx="6" class="ovenWin" stroke="#2b2b2b" stroke-width="2.5"/>
        <g class="flame"><path d="M30 41 q-6 -10 2 -18 q0 8 6 8 q2 -6 -2 -12 q12 6 8 22z" fill="#ff8a1f"/><path d="M34 41 q-2 -6 2 -10 q2 4 4 4 q2 3 -1 6z" fill="#ffe14d"/></g>
        <g class="flame"><path d="M56 41 q-6 -12 2 -20 q0 8 6 8 q2 -6 -2 -12 q12 6 8 24z" fill="#ff8a1f"/><path d="M60 41 q-2 -6 2 -10 q2 4 4 4 q2 3 -1 6z" fill="#ffe14d"/></g>
        <g class="flame"><path d="M82 41 q-6 -10 2 -18 q0 8 6 8 q2 -6 -2 -12 q12 6 8 22z" fill="#ff8a1f"/><path d="M86 41 q-2 -6 2 -10 q2 4 4 4 q2 3 -1 6z" fill="#ffe14d"/></g>

const ICON = {

(() => {

const typers = new Map();
function typeInto(el, text) {
  clearInterval(typers.get(el));
  const chars = [...text]; let i = 0; el.textContent = '';
  const t = setInterval(() => { el.textContent += chars[i++] || ''; if (i >= chars.length) clearInterval(t); }, 32);
  typers.set(el, t);
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}
function hop(el) { el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
let sayTimer = 0;
function say(text, mood, keep) {
  const el = $('helperSay'), m = $('helperMascot');
  typeInto(el, text); el.classList.add('show');
  m.classList.toggle('mood-sad', mood === 'sad');
  m.classList.toggle('mood-cheer', mood === 'cheer');
  hop(m);
  clearTimeout(sayTimer);
  if (!keep) sayTimer = setTimeout(() => { el.classList.remove('show'); m.classList.remove('mood-sad', 'mood-cheer'); }, 3400);
}
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function pop(text, color, el) {
  const [x, y] = centerOf(el || $('pizza'));
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = text; d.style.color = color; d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function burst(el, chars) {
  const [x, y] = centerOf(el);
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span'), a = (i / 12) * Math.PI * 2, r = 90 + rnd(60);
    s.className = 'spark'; s.textContent = chars[i % chars.length];
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px'); s.style.setProperty('--dy', Math.round(Math.sin(a) * r) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 850);
  }
}
function banner(text, blue) {

  document.body.appendChild(b); setTimeout(() => b.remove(), 1450);
}

const QUIZ = [
  {q:'피자는 어느 나라에서 처음 만들어졌을까요?', a:['이탈리아','미국','일본'], c:0},

  {q:'피자 도우는 주로 무엇으로 만들까요?', a:['쌀','감자','밀가루'], c:2},
  {q:'페페로니는 어떤 음식일까요?', a:['소시지(고기)','과일','채소'], c:0},
  {q:'파인애플은 어떤 맛이 날까요?', a:['쓴맛','새콤달콤한 맛','짠맛'], c:1},
  {q:'고구마는 어디에서 자랄까요?', a:['나무 위','물 속','땅 속'], c:2},

];
const BAKE = 3;            // 오븐 굽는 시간(초)
const RING = 898.5;        // 굽기 동그라미 길이
let G = null, loopId = 0;
function later(fn, ms) { const g = G; setTimeout(() => { if (G === g) fn(); }, ms); }

function newGame(seconds, tutorial) {
  const typed = ($('shopName').value || '').trim();
  store.set('shop', typed);
  clearGlow();
  const shop = (typed || '우리') + '의 피자가게';
  G = {
    tutorial, total: seconds, left: seconds, last: performance.now(), paused: false,
    shop, my: 0, served: 0, okCount: 0, pickyOk: 0, quizOk: 0, made: 0,
    guest: null, queue: [], toppings: [], pizza: 'raw', bakeLeft: 0,
    idle: 0, stuckSaid: false, quizIdx: rnd(QUIZ.length), lastBeep: -1,
    shops: [
      { k: 'me', name: shop, score: 0, disp: 0 },
      { k: 'rv', name: '옆 가게', score: 0, disp: 0 },
      { k: 'cr', name: '길 건너 가게', score: 0, disp: 0 },
      { k: 'mk', name: '시장 가게', score: 0, disp: 0 }
    ],
    prevRank: 0, lastRankMsg: 0
  };
  $('sign').textContent = shop;
  $('timer').classList.remove('hurry');
  buildBoard(); clearPizza(); renderCurrent(); renderQueue(); updateTimer();
  show('game');
  if (tutorial) say('주문 내역을 봐규! 손님이 원하는 재료를 눌러보라규', null, true);
  else { say('가게 문 열었다규! 옆 가게보다 많이 팔자규', 'cheer'); fillQueue(); }
  later(nextGuest, tutorial ? 400 : 900);
  clearInterval(loopId);
  loopId = setInterval(tick, 100);
}

/* ----- 실시간 순위판 ----- */
function buildBoard() {
  $('lb').innerHTML = G.shops.map(s => `<div class="lbr${s.k === 'me' ? ' me' : ''}" id="lb-${s.k}">
    <span class="rk"></span><span class="nm">${esc(s.k === 'me' ? '🍕 ' + s.name : s.name)}</span><span class="bar"><i style="background:${s.k === 'me' ? 'var(--red)' : s.k === 'rv' ? 'var(--blue)' : '#b8a68c'}"></i></span><span class="pt">0</span></div>`).join('');
  renderBoard();
}
function ranked() { return [...G.shops].sort((a, b) => b.score - a.score || (a.k === 'me' ? -1 : b.k === 'me' ? 1 : 0)); }
function renderBoard() {
  G.shops[0].score = G.my;
  const order = ranked(), max = Math.max(60, order[0].score), medal = ['🥇', '🥈', '🥉', '4'];
  order.forEach((s, i) => {
    s.disp += (s.score - s.disp) * .35;
    if (Math.abs(s.score - s.disp) < .5) s.disp = s.score;
    const row = $('lb-' + s.k);
    row.style.top = (i * 26) + 'px';
    row.children[0].textContent = medal[i];
    row.children[2].firstChild.style.width = (s.disp / max * 100) + '%';
    row.children[3].textContent = Math.round(s.disp);
  });
  const myRank = order.findIndex(s => s.k === 'me') + 1;
  const now = performance.now();
  if (!G.tutorial && G.prevRank && myRank !== G.prevRank && G.total - G.left > 3 && now - G.lastRankMsg > 3500) {
    G.lastRankMsg = now;
    if (myRank < G.prevRank) { sfx.up(); banner(myRank === 1 ? '🥇 1등!' : '역전!'); say('앞질렀다규! 이대로 가자규', 'cheer'); }
    else { sfx.down(); say(order[myRank - 2].name + '가 앞질렀다규! 힘내라규', 'sad'); }
  }
  G.prevRank = myRank;
}

/* ----- 손님 ----- */
function makeGuest() {
  G.made++;
  const n = G.made, look = randLook();
  if (n % 5 === 0) return { kind: 'quiz', look };
  const progress = 1 - G.left / G.total;
  let size, patience, picky = false;
  if (n > 4 && Math.random() < .25) { picky = true; size = 4 + rnd(2); patience = 30; }   // 진상손님: 재료 많고 빨리 가요, 점수 2배
  else { size = progress < .3 ? 1 + rnd(2) : progress < .65 ? 2 + rnd(2) : 3 + rnd(2); patience = progress < .5 ? 45 : 38; }
  const order = shuffle(INGS.map(i => i.id)).slice(0, size);
  return { kind: picky ? 'picky' : 'normal', look, order, patience, max: patience, picky, mood: '' };
}
function fillQueue() { while (G.queue.length < 2) G.queue.push(makeGuest()); renderQueue(); }
function renderQueue() {
  $('queue').innerHTML = G.queue.map(g => `<div class="qg">${guestSVG(g.look, g.kind === 'picky' ? 'angry' : 'ok', g.kind)}</div>`).join('');
}
function nextGuest() {
  if (!G || G.left <= 0) return;
  if (G.tutorial) {
    G.guest = { kind: 'normal', look: { skin: SKIN[0], hair: HAIR[3], shirt: SHIRT[1], style: 0 }, order: ['cheese', 'pepperoni'], patience: 1e9, max: 1e9, mood: '' };
    renderCurrent(true); sfx.bell(); tutorialCheck(); return;
  }
  G.guest = G.queue.shift(); fillQueue();
  sfx.bell(); renderCurrent(true);
  if (G.guest.kind === 'quiz') { later(askQuiz, 700); return; }
  if (G.guest.picky) say('진상손님이다규! 조심하라규', 'sad');
}
function moodOf(g) {
  if (!g || g.max >= 1e9) return 'happy';
  const r = g.patience / g.max;
  return r > .6 ? 'happy' : r > .35 ? 'ok' : r > .15 ? 'worried' : 'angry';
}
function renderCurrent(enter) {
  const cur = $('cur'), g = G && G.guest;
  cur.className = '';
  if (!g) { cur.innerHTML = ''; $('gBubble').textContent = '다음 손님을 기다려요'; $('gBubble').className = 'gBubble'; renderTicket(); setMoodBar(1); return; }
  g.mood = moodOf(g);
  cur.innerHTML = guestSVG(g.look, g.mood, g.kind);
  if (enter) { void cur.offsetWidth; cur.classList.add('walkin'); }
  const b = $('gBubble');
  if (g.kind === 'quiz') { b.textContent = '퀴즈 하나 낼게요!'; b.className = 'gBubble'; }
  else {
    const names = g.order.map(id => ING[id].name).join('·');
    b.textContent = g.picky ? `${names}! 빨리요! 😤` : `${names} 피자 주세요!`;
    b.className = 'gBubble' + (g.picky ? ' picky' : '');
  }
  renderTicket(); setMoodBar(g.max >= 1e9 ? 1 : g.patience / g.max);
}
function setMoodBar(r) {
  r = Math.max(0, Math.min(1, r));
  const bar = $('moodBar');
  bar.style.width = (r * 100) + '%';
  bar.style.background = r > .6 ? 'var(--green)' : r > .35 ? 'var(--yellow)' : r > .15 ? 'var(--orange)' : 'var(--red)';
  $('moodFace').textContent = r > .6 ? '😊' : r > .35 ? '🙂' : r > .15 ? '😟' : '😡';
}
function guestLeave(happy) {
  const cur = $('cur');
  cur.classList.remove('walkin'); void cur.offsetWidth;
  if (G.guest && G.guest.kind !== 'quiz') cur.innerHTML = guestSVG(G.guest.look, happy ? 'happy' : 'angry', G.guest.kind);
  cur.classList.add(happy ? 'byeHappy' : 'byeSad');
  G.guest = null;
  $('gBubble').textContent = happy ? '고마워요! 😋' : '흥! 😠'; $('gBubble').className = 'gBubble' + (happy ? '' : ' picky');
  later(() => { renderCurrent(); nextGuest(); }, 1000);
}
function renderTicket() {
  const g = G && G.guest;
  if (!g || g.kind === 'quiz') { $('ticketItems').innerHTML = g ? '🤓 퀴즈 손님!' : ''; return; }
  $('ticketItems').innerHTML = g.order.map(id =>
    `<span class="ti${G.toppings.includes(id) ? ' done' : ''}">${iconSVG(id)}${ING[id].name}</span>`).join('');
}

/* ----- 피자 만들기 ----- */
function toggleIng(id) {
  sfx.unlock();
  if (!G || G.pizza !== 'raw' || !G.guest || G.guest.kind === 'quiz') return;
  G.idle = 0; G.stuckSaid = false;
  const i = G.toppings.indexOf(id);
  if (i >= 0) {
    G.toppings.splice(i, 1);
    const el = $('pizza').querySelector(`[data-t="${id}"]`); if (el) el.remove();
    sfx.pop();
  } else {
    G.toppings.push(id);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('data-t', id); g.innerHTML = toppingMarkup(id);
    $(id === 'cheese' ? 'cheeseLayer' : 'tops').appendChild(g);
    sfx.drop();
  }
  renderPizzaUI(); renderTicket();
  if (G.tutorial) tutorialCheck();
}
function clearPizza() {
  const p = $('pizza');
  p.classList.add('notrans'); p.classList.remove('cook', 'baking');
  $('cheeseLayer').innerHTML = ''; $('tops').innerHTML = '';
  void p.getBoundingClientRect(); p.classList.remove('notrans');
  if (G) { G.toppings = []; G.pizza = 'raw'; G.bakeLeft = 0; }
  $('steam').classList.remove('on');
  $('ring').setAttribute('opacity', '0');
  renderPizzaUI(); renderTicket();
}
function renderPizzaUI() {
  if (!G) return;
  $('hint').style.display = G.toppings.length ? 'none' : '';
  INGS.forEach(i => {
    const b = $('ing-' + i.id);
    b.classList.toggle('on', G.toppings.includes(i.id));
    b.disabled = G.pizza !== 'raw';
  });
  $('ovenBtn').disabled = !(G.pizza === 'raw' && G.toppings.length > 0 && G.guest && G.guest.kind !== 'quiz');
  $('ovenBtn').textContent = G.pizza === 'baking' ? '굽는 중… 🔥' : G.pizza === 'baked' ? '다 구웠어요!' : '오븐에 넣기';
  $('serveBtn').disabled = G.pizza !== 'baked';
  $('resetBtn').disabled = G.pizza === 'baking';
  $('oven').classList.toggle('hot', G.pizza === 'baking');
}
function startBake() {
  if (!G || G.pizza !== 'raw' || !G.toppings.length || !G.guest) return;
  G.idle = 0; G.pizza = 'baking'; G.bakeLeft = BAKE;
  const p = $('pizza'); p.classList.add('cook', 'baking');
  $('ring').setAttribute('opacity', '1'); $('ring').setAttribute('stroke-dashoffset', RING);
  sfx.oven(); renderPizzaUI();
  if (G.tutorial) tutorialCheck();
}
function finishBake() {
  G.pizza = 'baked';
  $('pizza').classList.remove('baking');
  $('ring').setAttribute('opacity', '0');
  $('steam').classList.add('on');
  sfx.ding(); renderPizzaUI();
  if (G.tutorial) tutorialCheck();
}
function serve() {
  if (!G || G.pizza !== 'baked' || !G.guest) return;
  G.idle = 0; clearGlow();
  const g = G.guest, want = new Set(g.order);
  const same = want.size === G.toppings.length && G.toppings.every(x => want.has(x));
  G.served++;
  if (same) {
    let pts = g.order.length * 10;
    if (g.max < 1e9 && g.patience / g.max > .5) pts += 10;   // 빨리 내면 보너스
    if (g.picky) { pts *= 2; G.pickyOk++; }
    G.my += pts; G.okCount++;
    sfx.good(); pop('+' + pts, 'var(--green)'); burst($('pizza'), ['⭐', '✨', '🍕']); say(SAY.good, 'cheer');
  } else {
    G.my = Math.max(0, G.my - 5);
    sfx.bad(); pop('-5', 'var(--red)'); say(SAY.wrong, 'sad');
  }
  if (G.tutorial) {
    G.guest = null; renderCurrent(); clearPizza();
    G.left = 0; store.set('tutDone', true); setTimeout(() => $('tutDone').classList.add('on'), 1000); return;
  }
  guestLeave(same); clearPizza();
}

/* ----- 튜토리얼 안내 ----- */
function tutorialCheck() {
  if (!G || !G.guest) return;
  const need = G.guest.order;
  clearGlow();
  if (G.pizza === 'raw') {
    const missing = need.filter(x => !G.toppings.includes(x));
    const extra = G.toppings.filter(x => !need.includes(x));
    if (extra.length) { extra.forEach(x => $('ing-' + x).classList.add('glow')); say('주문에 없는 재료다규! 한 번 더 누르면 빠진다규', 'sad', true); }
    else if (missing.length) { missing.forEach(x => $('ing-' + x).classList.add('glow')); say('반짝이는 재료를 눌러보라규', null, true); }
    else { $('ovenBtn').classList.add('glow'); say('좋다규! 이제 오븐에 넣으라규', 'cheer', true); }
  } else if (G.pizza === 'baking') say('노릇노릇 구워지는 중이다규~', null, true);
  else if (G.pizza === 'baked') { $('serveBtn').classList.add('glow'); say('김이 모락모락! 피자를 내놓으라규', 'cheer', true); }
}
function clearGlow() { document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow')); }

/* ----- 퀴즈 손님 ----- */
function askQuiz() {
  G.paused = true;
  const q = QUIZ[G.quizIdx % QUIZ.length]; G.quizIdx++;
  $('quizQ').textContent = q.q;
  $('quizChoices').innerHTML = '';
  q.a.forEach((t, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
    b.addEventListener('click', () => {
      $('quizModal').classList.remove('on');
      if (!G) return;
      const ok = k === q.c;
      if (ok) { G.my += 20; G.quizOk++; sfx.good(); pop('+20', 'var(--green)', $('cur')); burst($('cur'), ['⭐', '✨']); say(SAY.good, 'cheer'); }
      else { sfx.bad(); say(SAY.wrong + ' 정답은 「' + q.a[q.c] + '」이라규', 'sad'); }
      G.paused = false; G.last = performance.now();
      guestLeave(ok);
    });
    $('quizChoices').appendChild(b);
  });
  $('quizModal').classList.add('on');
}

/* ----- 시간 흐름 ----- */
function updateTimer() {
  if (G.tutorial) { $('timer').textContent = '연습'; return; }
  const s = Math.max(0, Math.ceil(G.left));
  $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('hurry', s <= 60 && s > 0);
  if (s <= 10 && s > 0 && s !== G.lastBeep) { G.lastBeep = s; sfx.tick(); }
}
function tick() {
  if (!G) { clearInterval(loopId); return; }
  const now = performance.now(), dt = Math.min(1, (now - G.last) / 1000); G.last = now;
  if (G.paused || G.left <= 0) return;
  if (!G.tutorial) {
    G.left -= dt;
    const progress = 1 - G.left / G.total;
    // 옆 가게: 처음엔 빨리, 마지막 30%는 느려져서 역전할 수 있어요
    G.shops[1].score += dt * (progress < .7 ? 2.4 : .6) * (.6 + Math.random() * .8);
    G.shops[2].score += dt * 1.4 * (.5 + Math.random());
    G.shops[3].score += dt * 1.0 * (.5 + Math.random());
  }
  if (G.pizza === 'baking') {
    G.bakeLeft -= dt;
    $('ring').setAttribute('stroke-dashoffset', Math.max(0, RING * G.bakeLeft / BAKE).toFixed(1));
    if (G.bakeLeft <= 0) finishBake();
  }
  const g = G.guest;
  if (g && !G.tutorial && g.kind !== 'quiz') {
    g.patience -= dt;
    setMoodBar(g.patience / g.max);
    const m = moodOf(g);
    if (m !== g.mood) { g.mood = m; $('cur').innerHTML = guestSVG(g.look, m, g.kind); }
    if (g.patience <= 0) { sfx.bad(); say('손님이 기다리다 갔다규…', 'sad'); guestLeave(false); clearPizza(); }
  }
  if (!G.tutorial) {
    G.idle += dt;
    if (G.idle > 15 && !G.stuckSaid) { G.stuckSaid = true; helpMe(); }
  }
  updateTimer(); renderBoard();
  if (!G.tutorial && G.left <= 0) endGame();
}

/* ----- 막혔을 때 ----- */
function helpMe() {
  if (!G || !G.guest || G.guest.kind === 'quiz') { say(SAY.stuck, 'sad'); return; }
  clearGlow();
  const missing = G.guest.order.find(x => !G.toppings.includes(x));
  const extra = G.toppings.find(x => !G.guest.order.includes(x));
  if (G.pizza === 'raw' && extra) $('ing-' + extra).classList.add('glow');
  else if (G.pizza === 'raw' && missing) $('ing-' + missing).classList.add('glow');
  else if (G.pizza === 'raw') $('ovenBtn').classList.add('glow');
  else if (G.pizza === 'baked') $('serveBtn').classList.add('glow');
  say(SAY.stuck, 'sad');
  later(clearGlow, 3000);
}

/* ----- 끝: 영수증 ----- */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6 5.6 21.2l1.5-7.1L1.8 9.2l7.1-.8z" fill="#ffc53d" stroke="#c98a00" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function endGame() {
  clearInterval(loopId);
  clearGlow(); $('quizModal').classList.remove('on');
  G.shops[0].score = G.my;
  const order = ranked().map(s => ({ ...s, score: Math.round(s.score) }));
  const myRank = order.findIndex(s => s.k === 'me') + 1;
  const rv = order.find(s => s.k === 'rv').score;
  const stars = G.okCount === 0 ? 0 : myRank === 1 ? 3 : G.my > rv ? 2 : 1;
  const best = store.get('best', null);
  const isNew = G.my > 0 && (!best || G.my > best.score);
  if (isNew) store.set('best', { score: G.my, stars });
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const when = `${d.getFullYear()}.${p2(d.getMonth() + 1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const starText = ['피자를 맞혀서 내 보자규!', '영업 완료!', '옆 가게를 이겼어요!', '우리 동네 1등 피자가게!'][stars];
  $('paper').innerHTML = `
    <h2>🧾 영수증</h2>
    <div class="shop">${esc(G.shop)}</div>
    <div class="date">${when} · 영업 ${Math.max(1, Math.round(G.total / 60))}분</div>
    <div class="stamp${isNew ? '' : '" style="display:none'}" id="stamp">신기록!</div>
    <div class="dash"></div>
    <div class="ln"><span>만든 피자</span><span>${G.served}판</span></div>
    <div class="ln"><span>주문 맞힘</span><span>${G.okCount}판</span></div>
    <div class="ln"><span>진상손님 대접</span><span>${G.pickyOk}명</span></div>
    <div class="ln"><span>퀴즈 정답</span><span>${G.quizOk}개</span></div>
    <div class="dash"></div>
    <div class="ln total"><span>총점</span><span>${G.my}점</span></div>
    <div class="ln"><span>가게 순위</span><span>${myRank}등 / 4곳</span></div>
    <div class="rankList">${order.map((s, i) => `<div class="${s.k === 'me' ? 'me' : ''}">${i + 1}. ${esc(s.name)} — ${s.score}점</div>`).join('')}</div>
    <div class="dash"></div>
    <div class="stars">${STAR}${STAR}${STAR}</div>
    <div class="starText">${starText}</div>`;

  const recs = store.get('records', []);
  recs.push({ name: G.shop, score: G.my, min: Math.max(1, Math.round(G.total / 60)) });
  recs.sort((a, b) => b.score - a.score);
  const top = recs.slice(0, 5); store.set('records', top);
  $('records').innerHTML = '<b>🏆 이 기기 최고 기록</b><br><ol>' + top.map(r => `<li>${esc(r.name)} — ${r.score}점 (${r.min}분)</li>`).join('') + '</ol>';
  show('result');
  typeInto($('resultSay'), SAY.end);
  hop($('resultMascot'));
  sfx.end();
  const svgs = $('paper').querySelectorAll('.stars svg');
  for (let i = 0; i < stars; i++) later(() => { svgs[i].classList.add('on'); sfx.star(i); }, 700 + i * 450);
  if (isNew) later(() => { $('stamp').classList.add('on'); sfx.up(); }, 900 + stars * 450);
}

/* ===== 만든 기록 ===== */
async function openReceipt() {
  $('receiptModal').classList.add('on');
  $('receiptBody').textContent = '불러오는 중…';
  try {
    const r = await fetch('receipt.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const n = (v, unit) => v == null ? '계산 중' : Number(v).toLocaleString('ko-KR') + unit;
    $('receiptBody').innerHTML = `
      <div style="font-weight:800;font-size:21px;margin-bottom:6px">${esc(d.title || '')}</div>
      <div class="nums">
        <div class="num">AI가 일한 시간<b>${n(d.minutes, '분')}</b></div>
        <div class="num">주고받은 글자 조각(토큰)<b>${n(d.tokens, '개')}</b></div>
        <div class="num">돈으로 치면<b>${d.won == null ? '계산 중' : '약 ' + n(d.won, '원')}</b></div>
        <div class="num">고친 횟수<b>${n(d.revisions, '번')}</b></div>
      </div>
      ${d.priceNote ? `<div class="note">${esc(d.priceNote)}</div>` : ''}
      <h3>🙋 AI 혼자서는 못 해서 사람이 정한 것</h3>
      <ul>${(d.aiCouldNot || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h3>💰 더 하고 싶지만 돈·준비가 더 드는 것</h3>
      <ul>${(d.costsMore || []).map(c => `<li><b>${esc(c.feature)}</b> — ${esc(c.why)}</li>`).join('')}</ul>`;
  } catch (e) {
    $('receiptBody').textContent = '기록을 불러오지 못했어요. 인터넷 주소로 열었는지 확인해 주세요.';
  }
}

/* ===== 작은 도우미 ===== */
function rnd(n) { return Math.floor(Math.random() * n); }
function pick(a) { return a[rnd(a.length)]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ===== 버튼 연결 ===== */
const FAST = /[?&]fast\b/.test(location.search);   // 시험용: 주소 끝 ?fast → 연습판 30초
const start = (sec, tut) => { sfx.unlock(); sfx.tap(); newGame(sec, tut); };
$('openBtn').addEventListener('click', () => start(600, !store.get('tutDone', false)));
$('tutBtn').addEventListener('click', () => start(600, true));
$('shortBtn').addEventListener('click', () => start(FAST ? 30 : 180, false));
$('tutGo').addEventListener('click', () => { $('tutDone').classList.remove('on'); start(600, false); });
$('ovenBtn').addEventListener('click', startBake);
$('serveBtn').addEventListener('click', serve);
$('resetBtn').addEventListener('click', () => { if (G && G.pizza !== 'baking') { sfx.pop(); G.idle = 0; clearPizza(); if (G.tutorial) tutorialCheck(); } });
$('helpBtn').addEventListener('click', () => { if (G) G.idle = 0; helpMe(); });
$('againBtn').addEventListener('click', () => start(G ? G.total : 600, false));
$('toStartBtn').addEventListener('click', () => { sfx.tap(); G = null; showStart(); });
$('muteBtn').addEventListener('click', () => { const m = sfx.toggle(); $('muteBtn').textContent = m ? '🔇' : '🔈'; if (!m) sfx.tap(); });
$('receiptBtn').addEventListener('click', () => { sfx.tap(); openReceipt(); });
$('receiptClose').addEventListener('click', () => $('receiptModal').classList.remove('on'));
$('receiptModal').addEventListener('click', e => { if (e.target.id === 'receiptModal') $('receiptModal').classList.remove('on'); });
document.addEventListener('pointerdown', () => { if (G) G.idle = 0; });
showStart();
})();
</script>
