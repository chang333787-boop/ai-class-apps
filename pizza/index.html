<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>맛있는 피자 만들기</title>
<style>
:root{
  --bg:#fff8ee; --card:#ffffff; --line:#e6dccb; --ink:#2b2b2b; --soft:#7a6a55;
  --red:#e2483d; --orange:#f39c32; --yellow:#ffd25e; --green:#3aa65b; --blue:#3b82c4;
  --dough:#f6d9a2; --crust:#d9a45a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.corner{position:fixed;top:10px;z-index:30;padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);
  color:var(--ink);text-decoration:none;font-size:17px}
.corner.home{left:10px}.corner.receipt{right:10px}
.screen{display:none;min-height:100vh;padding:60px 14px 14px}
.screen.on{display:block}

/* ---------- 시작 화면 ---------- */
#start{text-align:center}
#start h1{font-size:clamp(30px,5vw,46px);margin:6px 0 2px}
#start .sub{font-size:19px;color:var(--soft);margin:0 0 6px}
.startMascot{width:min(240px,50vw);margin:0 auto;display:block}
.bubble{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 16px;font-size:22px;
  font-weight:700;position:relative;margin:4px 0 10px}
.nameRow{font-size:24px;margin:8px 0 14px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.nameRow input{font:inherit;font-size:24px;width:9em;padding:8px 10px;border:3px solid var(--line);border-radius:12px;text-align:center;
  -webkit-user-select:text;user-select:text}
.btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{font-size:24px;font-weight:800;padding:14px 26px;border-radius:16px;border:0;background:var(--red);color:#fff;box-shadow:0 4px 0 #b3342b}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b3342b}
.big.alt{background:var(--blue);box-shadow:0 4px 0 #2a6197}
.small{font-size:16px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;margin-top:14px}

/* ---------- 게임 화면 ---------- */
#game{padding-top:54px}
.top{display:grid;grid-template-columns:1.1fr 1fr 1.4fr 1.2fr;gap:10px;align-items:stretch;max-width:1200px;margin:0 auto}
.box{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 10px;position:relative}
.label{font-size:15px;font-weight:800;color:var(--soft)}
#ticket .items{font-size:22px;line-height:1.5;margin-top:2px;min-height:2.6em}
#ticket .items span{display:inline-block;margin-right:6px;white-space:nowrap}
#ticket .items span.done{opacity:.35;text-decoration:line-through}
.sign{display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,2.6vw,30px);font-weight:900;
  background:#fff3d6;border-color:var(--orange)}
#oven{display:flex;flex-direction:column;align-items:center;gap:4px}
.ovenBody{width:100%;height:46px;border-radius:10px;background:#555;position:relative;overflow:hidden;border:3px solid #333}
.ovenBody .win{position:absolute;inset:6px 14px;border-radius:6px;background:#2a2a2a}
.ovenBody.hot .win{background:linear-gradient(#ff9d3d,#e2483d);animation:glow .6s infinite alternate}
@keyframes glow{to{filter:brightness(1.3)}}
.ovenBar{position:absolute;left:0;bottom:0;height:5px;background:var(--yellow);width:0}
#ovenBtn{font-size:18px;font-weight:800;padding:6px 10px;border-radius:12px;border:0;background:var(--orange);color:#fff;width:100%}
#ovenBtn:disabled,#serveBtn:disabled{background:#ccc;color:#fff;box-shadow:none}
.timer{font-size:clamp(28px,3.6vw,40px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.score{font-size:15px;margin-top:2px}
.score .row{display:flex;align-items:center;gap:6px;margin:3px 0}
.score .nm{width:4.2em;font-weight:800}
.score .bar{flex:1;height:14px;background:#f1eadf;border-radius:8px;overflow:hidden}
.score .bar i{display:block;height:100%;width:0;transition:width .4s}
.score .pt{width:3.4em;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

.mid{display:grid;grid-template-columns:1fr minmax(240px,1.6fr) 1fr;gap:10px;max-width:1200px;margin:10px auto 0;align-items:center}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ing{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 2px;font-size:17px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-height:78px;justify-content:center}
.ing .em{font-size:34px;line-height:1}
.ing.on{border-color:var(--green);background:#eaf7ee}
.ing:disabled{opacity:.45}
.pep{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f06a5a,#b8261b);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.08);vertical-align:middle}
.pepSmall{width:22px;height:22px}
#doughWrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#dough{width:min(100%,330px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--dough) 62%,var(--crust) 64%,#c58d45 100%);
  position:relative;transition:filter .5s}
#dough.sauce{background:radial-gradient(circle,#e46b4a 0 58%,var(--dough) 60% 62%,var(--crust) 64%,#c58d45 100%)}
#dough.baked{filter:saturate(1.25) brightness(.92)}
#dough .t{position:absolute;font-size:30px;transform:translate(-50%,-50%);line-height:1}
#dough.empty::after{content:"재료를 눌러 올려요";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:#9a7a45;font-weight:700}
.doughBtns{display:flex;gap:8px}
#resetBtn{font-size:16px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}

.bottom{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;max-width:1200px;margin:10px auto 0;align-items:stretch}
#serveBtn{font-size:24px;font-weight:900;border:0;border-radius:16px;background:var(--green);color:#fff;box-shadow:0 4px 0 #2b7c44;min-height:76px}
#serveBtn:not(:disabled):active{transform:translateY(3px)}
#guest{display:flex;align-items:center;gap:10px}
#guest .face{font-size:46px;line-height:1}
#guest .info{flex:1}
#guest .who{font-size:17px;font-weight:800}
#guest .who b{color:var(--red)}
.patience{height:14px;border-radius:8px;background:#f1eadf;overflow:hidden;margin-top:4px}
.patience i{display:block;height:100%;width:100%;background:var(--green)}
#helper{display:flex;align-items:center;gap:6px;position:relative;padding-bottom:28px}
#helperMascot svg{width:80px;display:block}
#helper .say{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:18px;font-weight:800;min-height:2.2em;
  display:flex;align-items:center;opacity:0;transition:opacity .2s}
#helper .say.show{opacity:1}
#helpBtn{position:absolute;right:6px;bottom:4px;font-size:14px;padding:3px 8px;border-radius:10px;border:2px solid var(--line);background:#fff}

.glow{outline:5px solid var(--yellow);outline-offset:2px;animation:blink .8s infinite alternate;position:relative;z-index:2}
@keyframes blink{to{outline-color:#ffb800}}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;z-index:40;pointer-events:none;
  text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff;animation:popup 1s forwards}
@keyframes popup{from{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}to{opacity:0;transform:translate(-50%,-90%)}}

/* 마스코트 표정 */
.m-sweat,.m-wow{display:none}
.mood-wrong .m-sweat{display:inline}.mood-wrong .m-smile{display:none}.mood-wrong .m-wow{display:inline}
.bounce{animation:bounce .5s}
@keyframes bounce{30%{transform:translateY(-10px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}

/* ---------- 창(모달) ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:20px;padding:20px 22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;font-size:19px}
.sheet h2{margin:0 0 10px;font-size:26px}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{font-size:22px;padding:12px;border-radius:14px;border:3px solid var(--line);background:#fffaf2;font-weight:700}
.closeBtn{margin-top:14px;font-size:20px;padding:10px 20px;border-radius:14px;border:0;background:var(--ink);color:#fff}
.rc .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.rc .num{background:#fff8ee;border:2px solid var(--line);border-radius:12px;padding:8px}
.rc .num b{display:block;font-size:22px}
.rc h3{font-size:19px;margin:12px 0 4px}
.rc ul{margin:0;padding-left:1.2em;line-height:1.5}

/* ---------- 결과 화면 ---------- */
#result{text-align:center}
#result h1{font-size:34px;margin:4px 0}
.resultTop{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
#resultMascot svg{width:140px;display:block}
.rank{max-width:520px;margin:10px auto;text-align:left}
.rank .r{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;margin:6px 0;font-size:21px}
.rank .r.me{border-color:var(--red);background:#fff1ee}
.rank .r .n{font-size:26px;width:1.6em;text-align:center}
.rank .r .s{margin-left:auto;font-weight:900}
.records{max-width:520px;margin:8px auto;font-size:17px;color:var(--soft)}
.records ol{text-align:left;margin:4px auto;display:inline-block}

@media (max-width:820px){
  .top{grid-template-columns:1fr 1fr}
  .mid{grid-template-columns:1fr 1fr}
  #doughWrap{grid-column:1 / -1;order:-1}
  .bottom{grid-template-columns:1fr 1fr}
  #helper{grid-column:1 / -1}
}
</style>
</head>
<body>

<a class="corner home" href="../">← 처음으로</a>
<button class="corner receipt" id="receiptBtn" type="button">🧾 만든 기록</button>

<!-- 시작 화면 -->
<section class="screen on" id="start">
  <h1>🍕 맛있는 피자 만들기</h1>
  <p class="sub">손님 주문대로 피자를 만들고, 옆 가게보다 점수를 많이 모아요!</p>
  <div id="startMascot"></div>
  <div class="bubble" id="startSay"></div>
  <div class="nameRow">
    <input id="shopName" maxlength="8" placeholder="가게 이름" aria-label="가게 이름"><span>의 피자가게</span>
  </div>
  <div class="btnRow">
    <button class="big" id="openBtn" type="button">🔥 가게 열기 (10분)</button>
    <button class="big alt" id="tutBtn" type="button">📖 튜토리얼</button>
  </div>
  <button class="small" id="shortBtn" type="button">⏱️ 3분 연습</button>
</section>

<!-- 게임 화면 -->
<section class="screen" id="game">
  <div class="top">
    <div class="box" id="ticket"><div class="label">📋 주문 내역</div><div class="items" id="ticketItems"></div></div>
    <div class="box" id="oven">
      <div class="label">오븐</div>
      <div class="ovenBody" id="ovenBody"><div class="win"></div><div class="ovenBar" id="ovenBar"></div></div>
      <button id="ovenBtn" type="button">오븐에 넣기</button>
    </div>
    <div class="box sign" id="sign">우리의 피자가게</div>
    <div class="box">
      <div class="timer" id="timer">10:00</div>
      <div class="score">
        <div class="row"><span class="nm">내 가게</span><span class="bar"><i id="myBar" style="background:var(--red)"></i></span><span class="pt" id="myPt">0</span></div>
        <div class="row"><span class="nm">옆 가게</span><span class="bar"><i id="rvBar" style="background:var(--blue)"></i></span><span class="pt" id="rvPt">0</span></div>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="shelf" id="shelfL"></div>
    <div id="doughWrap">
      <div id="dough" class="empty"></div>
      <div class="doughBtns"><button id="resetBtn" type="button">🔄 다시 만들기</button></div>
    </div>
    <div class="shelf" id="shelfR"></div>
  </div>

  <div class="bottom">
    <button id="serveBtn" type="button" disabled>🍽️ 피자 내놓기</button>
    <div class="box" id="guest">
      <div class="face" id="guestFace">🙂</div>
      <div class="info"><div class="who" id="guestWho">손님을 기다려요</div><div class="patience"><i id="patBar"></i></div></div>
    </div>
    <div class="box" id="helper">
      <div id="helperMascot"></div>
      <div class="say" id="helperSay"></div>
      <button id="helpBtn" type="button">🆘 도와줘</button>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<section class="screen" id="result">
  <div class="resultTop"><div id="resultMascot"></div><div class="bubble" id="resultSay"></div></div>
  <h1 id="resultTitle">영업 끝!</h1>
  <p style="font-size:20px;margin:2px" id="resultSum"></p>
  <div class="rank" id="rank"></div>
  <div class="records" id="records"></div>
  <div class="btnRow" style="margin-top:10px">
    <button class="big" id="againBtn" type="button">🔁 다시 하기</button>
    <button class="big alt" id="toStartBtn" type="button">🏠 처음 화면</button>
  </div>
</section>

<!-- 퀴즈 창 -->
<div class="modal" id="quizModal"><div class="sheet">
  <h2>🤓 퀴즈 손님이 왔어요!</h2>
  <div id="quizQ" style="font-size:22px;font-weight:700"></div>
  <div class="choices" id="quizChoices"></div>
</div></div>

<!-- 만든 기록 창 -->
<div class="modal" id="receiptModal"><div class="sheet rc">
  <h2>🧾 만든 기록</h2>
  <div id="receiptBody">불러오는 중…</div>
  <button class="closeBtn" id="receiptClose" type="button">닫기</button>
</div></div>

<!-- 튜토리얼 끝 창 -->
<div class="modal" id="tutDone"><div class="sheet" style="text-align:center">
  <h2>튜토리얼 끝!</h2>
  <p>이제 진짜 가게를 열어 볼까요?</p>
  <div class="btnRow"><button class="big" id="tutGo" type="button">🔥 가게 열기 (10분)</button></div>
</div></div>

<script>
(() => {
'use strict';

/* ===== 마스코트 말 (기획서에 쓴 말, 말끝마다 "규") ===== */
const MASCOT = '도우규';
const SAY = {
  hello: '이름이 뭐야규? 난 ' + MASCOT,
  good:  '와 잘했다규',
  wrong: '어라?규?',
  stuck: '다시해보라규',
  end:   '굿규'
};

/* ===== 재료 ===== */
const INGS = [
  {id:'cheese',    name:'치즈',     em:'🧀', side:'L'},
  {id:'pineapple', name:'파인애플', em:'🍍', side:'L'},
  {id:'garlic',    name:'갈릭',     em:'🧄', side:'L'},
  {id:'shrimp',    name:'새우',     em:'🦐', side:'L'},
  {id:'hot',       name:'핫소스',   em:'🌶️', side:'L'},
  {id:'olive',     name:'올리브',   em:'🫒', side:'R'},
  {id:'pepperoni', name:'페페로니', em:'PEP', side:'R'},
  {id:'pepper',    name:'피망',     em:'🫑', side:'R'},
  {id:'potato',    name:'고구마',   em:'🍠', side:'R'}
];
const ING = Object.fromEntries(INGS.map(i => [i.id, i]));
const emHTML = (i, small) => i.em === 'PEP' ? `<span class="pep${small ? ' pepSmall' : ''}"></span>` : i.em;

/* 도우 위 재료 자리 (재료마다 3곳) */
const SPOTS = {};
INGS.forEach((g, k) => {
  SPOTS[g.id] = [0, 1, 2].map(j => {
    const a = (k * 40 + j * 120 + k * 7) * Math.PI / 180;
    const r = 16 + ((k * 13 + j * 9) % 20);
    return [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
  });
});

const QUIZ = [
  {q:'피자는 어느 나라에서 처음 만들어졌을까요?', a:['이탈리아','미국','일본'], c:0},
  {q:'치즈는 무엇으로 만들까요?', a:['밀가루','우유','설탕'], c:1},
  {q:'피자 도우는 주로 무엇으로 만들까요?', a:['쌀','감자','밀가루'], c:2},
  {q:'페페로니는 어떤 음식일까요?', a:['소시지(고기)','과일','채소'], c:0},
  {q:'파인애플은 어떤 맛이 날까요?', a:['쓴맛','새콤달콤한 맛','짠맛'], c:1},
  {q:'고구마는 어디에서 자랄까요?', a:['나무 위','물 속','땅 속'], c:2},
  {q:'오븐은 무엇을 하는 기계일까요?', a:['음식을 굽는 기계','음식을 얼리는 기계','그릇을 씻는 기계'], c:0}
];
const GUESTS = ['🙂','😀','🧒','👧','👦','👩','👨','👵','👴','🧑'];
const BAKE = 3;        // 오븐 굽는 시간(초)

/* ===== 기기 저장 ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pizza_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pizza_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ===== 마스코트 SVG ===== */
let svgNo = 0;
function mascotSVG() {
  const u = 'm' + (++svgNo);
  const ring = (cx, cy, n, r1, r2) => {
    let s = '';
    for (let i = 0; i < n; i++) {
      const a1 = (i / n) * Math.PI * 2, a2 = ((i + .5) / n) * Math.PI * 2, a3 = ((i + 1) / n) * Math.PI * 2;
      const p = (a, r) => (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
      s += p(a1, r1) + ' ' + p(a2, r2) + ' ' + p(a3, r1) + ' ';
    }
    return s;
  };
  const stripes = x0 => { let s = ''; for (let x = x0; x < x0 + 200; x += 9) s += `<line x1="${x}" y1="0" x2="${x}" y2="240"/>`; return s; };
  const sun = (cx, cy) => `<polygon points="${ring(cx, cy, 12, 11, 17)}" fill="#ffd25e" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="${cx}" cy="${cy}" r="11" fill="#ffe9a8" stroke="#2b2b2b" stroke-width="2.5"/>
      <circle cx="${cx - 3.5}" cy="${cy - 2}" r="1.6" fill="#2b2b2b"/><circle cx="${cx + 3.5}" cy="${cy - 2}" r="1.6" fill="#2b2b2b"/>
      <path d="M${cx - 4} ${cy + 3} q4 4 8 0" fill="none" stroke="#2b2b2b" stroke-width="2"/>`;
  const body = 'M18 118 h164 a8 8 0 0 1 0 22 h-34 v84 h-96 v-84 h-34 a8 8 0 0 1 0 -22z';
  return `<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="마스코트 ${MASCOT}">
  <defs><clipPath id="${u}b"><path d="${body}"/></clipPath>
  <clipPath id="${u}l"><rect x="40" y="136" width="18" height="44" rx="6"/></clipPath><clipPath id="${u}r"><rect x="142" y="136" width="18" height="44" rx="6"/></clipPath></defs>
  <g clip-path="url(#${u}b)"><rect x="0" y="100" width="200" height="140" fill="#fff4f0"/><g stroke="#e2483d" stroke-width="3">${stripes(0)}</g></g>
  <path d="${body}" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>

}

/* ===== 화면 요소 ===== */
const $ = id => document.getElementById(id);
['startMascot', 'helperMascot', 'resultMascot'].forEach(id => { $(id).innerHTML = mascotSVG(); });
$('startMascot').firstElementChild.classList.add('startMascot');
$('startSay').textContent = SAY.hello;
$('shopName').value = store.get('shop', '');

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}

let sayTimer = 0;
function say(text, mood, keep) {
  const el = $('helperSay'), m = $('helperMascot');
  el.textContent = text; el.classList.add('show');
  m.classList.toggle('mood-wrong', mood === 'wrong');
  m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce');
  clearTimeout(sayTimer);
  if (!keep) sayTimer = setTimeout(() => { el.classList.remove('show'); m.classList.remove('mood-wrong'); }, 3200);
}
function pop(text, color) {
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = text; d.style.color = color;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}

/* 재료 버튼 만들기 */
INGS.forEach(g => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'ing'; b.id = 'ing-' + g.id;
  b.innerHTML = `<span class="em">${emHTML(g)}</span>${g.name}`;
  b.addEventListener('click', () => toggleIng(g.id));
  $(g.side === 'L' ? 'shelfL' : 'shelfR').appendChild(b);
});

/* ===== 게임 상태 ===== */
let G = null;          // 한 판의 상태
let loopId = 0;
// 이 판이 아직 진행 중일 때만 나중에 실행
function later(fn, ms) { const g = G; setTimeout(() => { if (G === g) fn(); }, ms); }

function newGame(seconds, tutorial) {
  const typed = ($('shopName').value || '').trim();
  store.set('shop', typed);
  clearGlow();
  G = {
    tutorial, total: seconds, left: seconds, last: performance.now(), paused: false,
    shop: typed || '우리', my: 0, rival: 0, served: 0, okCount: 0, guestNo: 0,
    guest: null, toppings: new Set(), pizza: 'raw', bakeLeft: 0,
    idle: 0, stuckSaid: false, quizIdx: rnd(QUIZ.length)
  };
  $('sign').textContent = G.shop + '의 피자가게';
  $('timer').classList.remove('hurry');
  resetPizza(); renderGuest(); updateScore(); updateTimer();
  show('game');
  if (tutorial) say('주문 내역을 봐규! 손님이 원하는 재료를 눌러보라규', null, true);
  else say('가게 문 열었다규! 옆 가게보다 많이 팔자규');
  later(nextGuest, tutorial ? 300 : 800);
  clearInterval(loopId);
  loopId = setInterval(tick, 100);
}

/* 손님 */
function nextGuest() {
  if (!G || G.left <= 0) return;
  G.guestNo++;
  const n = G.guestNo;
  if (G.tutorial) {
    G.guest = { face: '🧒', order: ['cheese', 'pepperoni'], patience: 9999, max: 9999, picky: false };
    renderGuest(); tutorialCheck(); return;
  }
  if (n % 5 === 0) { askQuiz(); return; }               // 다섯 번째 손님마다 퀴즈 손님
  const progress = 1 - G.left / G.total;
  let size, patience, picky = false;
  if (n > 4 && Math.random() < 0.25) {                  // 진상손님: 재료 많고 빨리 가요, 점수 2배
    picky = true; size = 4 + rnd(2); patience = 30;
  } else {                                             // 시간이 갈수록 주문이 까다로워져요
    size = progress < .3 ? 1 + rnd(2) : progress < .65 ? 2 + rnd(2) : 3 + rnd(2);
    patience = progress < .5 ? 45 : 38;
  }
  const order = shuffle(INGS.map(i => i.id)).slice(0, size);
  G.guest = { face: picky ? '😤' : GUESTS[rnd(GUESTS.length)], order, patience, max: patience, picky };
  renderGuest();
  if (picky) say('진상손님이다규! 조심하라규', 'wrong');
}
function renderGuest() {
  const g = G && G.guest;
  if (!g) {
    $('guestFace').textContent = '🚪'; $('guestWho').textContent = '다음 손님을 기다려요';
    $('ticketItems').innerHTML = ''; $('patBar').style.width = '0'; return;
  }
  $('guestFace').textContent = g.face;
  $('guestWho').innerHTML = g.picky ? '<b>진상손님</b> (점수 2배!)' : '손님이 기다려요';
  renderTicket(); updatePatience();
}
function renderTicket() {
  const g = G && G.guest; if (!g) return;
  $('ticketItems').innerHTML = g.order.map(id => {
    const i = ING[id];
    return `<span class="${G.toppings.has(id) ? 'done' : ''}">${emHTML(i, true)} ${i.name}</span>`;
  }).join('');
}
function updatePatience() {
  const g = G.guest; if (!g) return;
  const r = g.max >= 9999 ? 1 : Math.max(0, g.patience / g.max);
  const bar = $('patBar');
  bar.style.width = (r * 100) + '%';
  bar.style.background = r > .5 ? 'var(--green)' : r > .25 ? 'var(--orange)' : 'var(--red)';
}

/* 피자 만들기 */
function toggleIng(id) {
  if (!G || G.pizza !== 'raw' || !G.guest) return;
  G.idle = 0; G.stuckSaid = false;
  if (G.toppings.has(id)) G.toppings.delete(id); else G.toppings.add(id);
  renderPizza(); renderTicket();
  if (G.tutorial) tutorialCheck();
}
function resetPizza() {
  if (!G) return;
  G.toppings.clear(); G.pizza = 'raw'; G.bakeLeft = 0;
  renderPizza(); renderTicket();
}
function renderPizza() {
  const d = $('dough');
  d.classList.toggle('empty', G.toppings.size === 0);
  d.classList.toggle('sauce', G.toppings.size > 0);
  d.classList.toggle('baked', G.pizza === 'baked');
  let html = '';
  G.toppings.forEach(id => {
    SPOTS[id].forEach(([x, y]) => { html += `<span class="t" style="left:${x}%;top:${y}%">${emHTML(ING[id], true)}</span>`; });
  });
  d.innerHTML = html;
  INGS.forEach(i => {
    const b = $('ing-' + i.id);
    b.classList.toggle('on', G.toppings.has(i.id));
    b.disabled = G.pizza !== 'raw';
  });
  $('ovenBtn').disabled = !(G.pizza === 'raw' && G.toppings.size > 0 && G.guest);
  $('ovenBtn').textContent = G.pizza === 'baking' ? '굽는 중…' : G.pizza === 'baked' ? '다 구웠어요!' : '오븐에 넣기';
  $('serveBtn').disabled = G.pizza !== 'baked';
  $('resetBtn').disabled = G.pizza === 'baking';
  $('ovenBody').classList.toggle('hot', G.pizza === 'baking');
  $('ovenBar').style.width = G.pizza === 'baking' ? ((1 - G.bakeLeft / BAKE) * 100) + '%' : '0';
}
function startBake() {
  if (!G || G.pizza !== 'raw' || G.toppings.size === 0 || !G.guest) return;
  G.idle = 0; G.pizza = 'baking'; G.bakeLeft = BAKE; renderPizza();
  if (G.tutorial) tutorialCheck();
}
function serve() {
  if (!G || G.pizza !== 'baked' || !G.guest) return;
  G.idle = 0; clearGlow();
  const g = G.guest, want = new Set(g.order);
  const same = want.size === G.toppings.size && [...want].every(x => G.toppings.has(x));
  G.served++;
  if (same) {
    let pts = g.order.length * 10;
    if (g.max < 9999 && g.patience / g.max > .5) pts += 10;   // 빨리 내면 보너스
    if (g.picky) pts *= 2;
    G.my += pts; G.okCount++;
    pop('+' + pts, 'var(--green)'); say(SAY.good);
  } else {
    G.my = Math.max(0, G.my - 5);
    pop('-5', 'var(--red)'); say(SAY.wrong, 'wrong');
  }
  updateScore();
  G.guest = null; renderGuest(); resetPizza();
  if (G.tutorial) { G.left = 0; store.set('tutDone', true); setTimeout(() => $('tutDone').classList.add('on'), 900); return; }
  later(nextGuest, 1200);
}

/* 튜토리얼 안내 */
function tutorialCheck() {
  if (!G || !G.guest) return;
  const need = G.guest.order;
  clearGlow();
  if (G.pizza === 'raw') {
    const missing = need.filter(x => !G.toppings.has(x));
    const extra = [...G.toppings].filter(x => !need.includes(x));
    if (extra.length) { extra.forEach(x => $('ing-' + x).classList.add('glow')); say('주문에 없는 재료다규! 한 번 더 누르면 빠진다규', 'wrong', true); }
    else if (missing.length) { missing.forEach(x => $('ing-' + x).classList.add('glow')); say('반짝이는 재료를 눌러보라규', null, true); }
    else { $('ovenBtn').classList.add('glow'); say('좋다규! 이제 오븐에 넣으라규', null, true); }
  } else if (G.pizza === 'baking') {
    say('3초만 기다리라규~', null, true);
  } else if (G.pizza === 'baked') {
    $('serveBtn').classList.add('glow'); say('다 구웠다규! 피자를 내놓으라규', null, true);
  }
}
function clearGlow() { document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow')); }

/* 퀴즈 손님 */
function askQuiz() {
  G.paused = true;
  const q = QUIZ[G.quizIdx % QUIZ.length]; G.quizIdx++;
  $('quizQ').textContent = q.q;
  $('quizChoices').innerHTML = '';
  q.a.forEach((t, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
    b.addEventListener('click', () => {
      $('quizModal').classList.remove('on');
      if (!G) return;
      if (k === q.c) { G.my += 20; pop('+20', 'var(--green)'); say(SAY.good); }
      else say(SAY.wrong + ' 정답은 「' + q.a[q.c] + '」이라규', 'wrong');
      updateScore();
      G.paused = false; G.last = performance.now();
      later(nextGuest, 900);
    });
    $('quizChoices').appendChild(b);
  });
  $('guestFace').textContent = '🤓'; $('guestWho').textContent = '퀴즈 손님!'; $('ticketItems').innerHTML = '';
  $('quizModal').classList.add('on');
}

/* 점수·시간 */
function updateScore() {
  if (!G) return;
  const max = Math.max(100, G.my, G.rival);
  $('myPt').textContent = G.my; $('rvPt').textContent = Math.round(G.rival);
  $('myBar').style.width = (G.my / max * 100) + '%';
  $('rvBar').style.width = (G.rival / max * 100) + '%';
}
function updateTimer() {
  const s = Math.max(0, Math.ceil(G.left));
  $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('hurry', !G.tutorial && s <= 60 && s > 0);
}

function tick() {
  if (!G) { clearInterval(loopId); return; }
  const now = performance.now();
  const dt = Math.min(1, (now - G.last) / 1000); G.last = now;
  if (!G.paused && G.left > 0) {
    if (!G.tutorial) {
      G.left -= dt;
      // 옆 가게: 처음엔 빨리, 마지막 30%는 느려져서 역전할 수 있어요
      const progress = 1 - G.left / G.total;
      G.rival += dt * (progress < .7 ? 2.4 : 0.6);
    }
    if (G.pizza === 'baking') {
      G.bakeLeft -= dt;
      if (G.bakeLeft <= 0) { G.pizza = 'baked'; if (G.tutorial) tutorialCheck(); }
      renderPizza();
    }
    if (G.guest && !G.tutorial) {
      G.guest.patience -= dt;
      if (G.guest.patience <= 0) {
        say('손님이 기다리다 갔다규…', 'wrong');
        G.guest = null; renderGuest(); resetPizza();
        later(nextGuest, 1000);
      }
      updatePatience();
    }
    if (!G.tutorial) {
      G.idle += dt;
      if (G.idle > 15 && !G.stuckSaid) { G.stuckSaid = true; helpMe(); }
    }
    updateTimer(); updateScore();
    if (!G.tutorial && G.left <= 0) { endGame(); return; }
  }
}

/* 막혔을 때 */
function helpMe() {
  if (!G || !G.guest) { say(SAY.stuck); return; }
  clearGlow();
  const missing = G.guest.order.find(x => !G.toppings.has(x));
  const extra = [...G.toppings].find(x => !G.guest.order.includes(x));
  if (G.pizza === 'raw' && extra) $('ing-' + extra).classList.add('glow');
  else if (G.pizza === 'raw' && missing) $('ing-' + missing).classList.add('glow');
  else if (G.pizza === 'raw') $('ovenBtn').classList.add('glow');
  else if (G.pizza === 'baked') $('serveBtn').classList.add('glow');
  say(SAY.stuck, 'wrong');
  later(clearGlow, 3000);
}

/* 끝 */
function endGame() {
  clearInterval(loopId);
  clearGlow(); $('quizModal').classList.remove('on');
  const my = G.my, rv = Math.round(G.rival), scale = G.total / 600;
  const all = [
    { name: '옆 가게', score: rv },
    { name: '길 건너 가게', score: Math.round((480 + rnd(260)) * scale) },
    { name: '시장 가게', score: Math.round((300 + rnd(300)) * scale) },
    { name: G.shop + '의 피자가게', score: my, me: true }
  ].sort((a, b) => b.score - a.score || (b.me ? 1 : 0) - (a.me ? 1 : 0));
  const medal = ['🥇', '🥈', '🥉', '4'];
  $('rank').innerHTML = '<div class="label" style="font-size:18px">🏆 가게 순위</div>' + all.map((o, k) =>
    `<div class="r${o.me ? ' me' : ''}"><span class="n">${medal[k]}</span>${esc(o.name)}<span class="s">${o.score}점</span></div>`).join('');
  const myRank = all.findIndex(o => o.me) + 1;
  $('resultTitle').textContent = myRank === 1 ? '🎉 우리 가게가 1등!' : `영업 끝! ${myRank}등`;
  $('resultSum').textContent = `만든 피자 ${G.served}판 · 주문 맞힘 ${G.okCount}판 · 점수 ${my}점`;
  $('resultSay').textContent = SAY.end;

  const recs = store.get('records', []);
  recs.push({ name: G.shop + '의 피자가게', score: my, min: Math.max(1, Math.round(G.total / 60)) });
  recs.sort((a, b) => b.score - a.score);
  const top = recs.slice(0, 5); store.set('records', top);
  $('records').innerHTML = '<b>이 기기 최고 기록</b><br><ol>' +
    top.map(r => `<li>${esc(r.name)} — ${r.score}점 (${r.min}분)</li>`).join('') + '</ol>';
  G.ended = true;
  show('result');
}

/* ===== 만든 기록(영수증) ===== */
async function openReceipt() {
  $('receiptModal').classList.add('on');
  $('receiptBody').textContent = '불러오는 중…';
  try {
    const r = await fetch('receipt.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const n = (v, unit) => v == null ? '계산 중' : Number(v).toLocaleString('ko-KR') + unit;
    $('receiptBody').innerHTML = `
      <div style="font-weight:800;font-size:21px;margin-bottom:6px">${esc(d.title || '')}</div>
      <div class="nums">
        <div class="num">AI가 일한 시간<b>${n(d.minutes, '분')}</b></div>
        <div class="num">주고받은 글자 조각(토큰)<b>${n(d.tokens, '개')}</b></div>
        <div class="num">돈으로 치면<b>${d.won == null ? '계산 중' : '약 ' + n(d.won, '원')}</b></div>
        <div class="num">고친 횟수<b>${n(d.revisions, '번')}</b></div>
      </div>
      <h3>🙋 AI 혼자서는 못 해서 사람이 정한 것</h3>
      <ul>${(d.aiCouldNot || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h3>💰 더 하고 싶지만 돈·준비가 더 드는 것</h3>
      <ul>${(d.costsMore || []).map(c => `<li><b>${esc(c.feature)}</b> — ${esc(c.why)}</li>`).join('')}</ul>`;
  } catch (e) {
    $('receiptBody').textContent = '기록을 불러오지 못했어요. 인터넷 주소로 열었는지 확인해 주세요.';
  }
}

/* ===== 도우미 ===== */
function rnd(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ===== 버튼 연결 ===== */
const FAST = /[?&]fast\b/.test(location.search);   // 테스트용: 주소 끝 ?fast → 연습판 30초
$('openBtn').addEventListener('click', () => newGame(600, !store.get('tutDone', false)));
$('tutBtn').addEventListener('click', () => newGame(600, true));
$('shortBtn').addEventListener('click', () => newGame(FAST ? 30 : 180, false));
$('tutGo').addEventListener('click', () => { $('tutDone').classList.remove('on'); newGame(600, false); });
$('ovenBtn').addEventListener('click', startBake);
$('serveBtn').addEventListener('click', serve);
$('resetBtn').addEventListener('click', () => { if (G && G.pizza !== 'baking') { G.idle = 0; resetPizza(); if (G.tutorial) tutorialCheck(); } });
$('helpBtn').addEventListener('click', () => { if (G) G.idle = 0; helpMe(); });
$('againBtn').addEventListener('click', () => newGame(G ? G.total : 600, false));
$('toStartBtn').addEventListener('click', () => { G = null; show('start'); });
$('receiptBtn').addEventListener('click', openReceipt);
$('receiptClose').addEventListener('click', () => $('receiptModal').classList.remove('on'));
$('receiptModal').addEventListener('click', e => { if (e.target.id === 'receiptModal') $('receiptModal').classList.remove('on'); });
document.addEventListener('pointerdown', () => { if (G) G.idle = 0; });
})();
</script>
